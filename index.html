<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oyun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: relative; margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; background: #000; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- ARAYÜZ KURALI (her yeni arayüzde geçerli) ----------
     Safe area KULLANILMIYOR. Bunun yerine ekranın en üstündeki UI_TOP (px) bandı (saat, pil, sinyal,
     Dynamic Island / çentik) TAMAMEN BOŞ bırakılır: bu bandın içine buton, geri/sıfırla düğmesi, hap (pill),
     başlık ya da okunması gereken hiçbir yazı KONMAZ. Yeni ekran/sayfa tasarlarken en üstteki butonların
     üst kenarı en az UI_TOP değerinde başlamalı (y >= UI_TOP). Dikey (portre) için geçerli; yatayda üst bant yok. */
  const UI_TOP = 68;

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  /* YARI SAYDAM YAZI YOK: yazı rengi alfalıysa zemin rengiyle karıştırılıp opak renge çevrilir (globalAlpha geçiş animasyonlarına dokunulmaz) */
  { const _ft = ctx.fillText.bind(ctx), RX = /^rgba\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)$/;
    ctx.fillText = function (t, x, y, mw) {
      const fs = ctx.fillStyle, m = typeof fs === 'string' && RX.exec(fs);
      if (m && +m[4] < 1) {
        const a = Math.max(0, Math.min(1, +m[4])), b = (typeof light !== 'undefined' && light) ? 242 : 8, k = c => Math.round(b + (+c - b) * a);
        ctx.fillStyle = `rgb(${k(m[1])},${k(m[2])},${k(m[3])})`; mw === undefined ? _ft(t, x, y) : _ft(t, x, y, mw); ctx.fillStyle = fs; return;
      }
      mw === undefined ? _ft(t, x, y) : _ft(t, x, y, mw);
    };
  }
  let W = 0, H = 0, DPR = 1;
  let SEED = 0;   // harita tohumu: her yeni oyunda rastgele; hashN ile üretilen her şey (heykel, sandık, kamp, harabe) buna bağlıdır
  const cam = { x: 0, y: 0 };
  const atk = { id: null, down: false, kb: false, x: 0, y: 0, r: 42, vis: 0, rip: 0, was: false, spin: 0 };   // saldırı butonu (vis: 0 = yok, 1 = tam görünür)
  const setBase = () => ctx.setTransform(DPR, 0, 0, DPR, -cam.x * DPR, -cam.y * DPR);   // dünya -> ekran

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı (home indicator) hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (H > W && full > H) H = full;
    }
    const de = document.documentElement.style, bs = document.body.style;
    de.height = H + 'px'; bs.width = W + 'px'; bs.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cam.x = player.x - W / 2; cam.y = player.y - H / 2;
  }

  /* ---------- Hata ayıklama bilgisi (açık zemin modunda görünür) ---------- */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function debugLines() {
    const sab = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    return [
      'tuval ' + W + 'x' + H,
      'inner ' + innerWidth + 'x' + innerHeight,
      'screen ' + screen.width + 'x' + screen.height,
      '100vh ' + probe.getBoundingClientRect().height,
      'alt guvenli alan ' + sab,
      'ust guvenli alan ' + (parseFloat(getComputedStyle(probe).paddingTop) || 0),
      'vv ' + (window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '-'),
      'scrollY ' + scrollY,
      'standalone ' + navigator.standalone
    ];
  }

  /* ---------- Oyuncu ---------- */
  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, angle: -Math.PI / 2 };
  const SPEED = 230;

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  function toggleBg() {
    light = !light;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      toggleBg(); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  function joyStart(e) {
    AU.unlock();
    if (DEATH.on) { deathTap(e.clientX, e.clientY); return; }   // ölüm ekranı: yalnızca düğmeler
    if (MENU.on && PAUSE.on) { pauseDown(e); return; }   // ana menüden açılan kıyafet sayfası
    if (MENU.on) { menuTap(e.clientX, e.clientY); return; }   // ana menü açıkken dokunuşlar yalnızca menüye gider
    if (PAUSE.on) { pauseDown(e); return; }   // duraklatılmışken dokunuşlar yalnızca menüye gider
    if (Math.hypot(e.clientX - AU.btn.x, e.clientY - AU.btn.y) < AU.btn.r + 14) { togglePause(); return; }   // duraklatma düğmesi
    if (atk.id === null && atkActive() && Math.hypot(e.clientX - atk.x, e.clientY - atk.y) < atk.r + 14) {   // buton joystick'ten önceliklidir
      atk.id = e.pointerId; atk.down = true; pressAtk();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (BOW.id === null && BOW.has && BOW.vv > 0.6 && Math.hypot(e.clientX - BOW.bx, e.clientY - BOW.by) < BOW.r + 14) {   // yay düğmesi
      BOW.id = e.pointerId; BOW.down = true;
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (campBtnAt(e.clientX, e.clientY)) { campAction(); return; }   // kamp: craft tezgahı
    { const dk = devHpAt(e.clientX, e.clientY); if (dk) { devHpAct(dk); return; } }   // geliştirici can düğmeleri
    { const hk = healBtnAt(e.clientX, e.clientY); if (hk) { healStart(hk); return; } }   // şifa düğmeleri
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY;
    joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { // taban parmağı takip eder
      const k = (d - joy.R) / d;
      joy.bx += dx * k; joy.by += dy * k;
      dx = e.clientX - joy.bx; dy = e.clientY - joy.by;
    }
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
    joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId === BOW.id) { BOW.id = null; BOW.down = false; return; }
    if (e.pointerId === atk.id) { atk.id = null; atk.down = false; relAtk(); return; }
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0;
    joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => { if (MENU.on) { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'j') && MENU.t > 2.4 && !PAUSE.on) menuStart(!!SAVED); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } if (e.key === 'Escape' && PAUSE.on && PAUSE.page !== 'main') { if (PAUSE.page === 'guide') rehberBack(); else if (PAUSE.page === 'craft') craftBack(); else if (PAUSE.page === 'inv') invBack(); else if (PAUSE.page === 'smelt') smeltBack(); else PAUSE.page = 'main'; return; } if ((e.key.toLowerCase() === 'p' || e.key === 'Escape') && !e.repeat) { togglePause(); return; } if (PAUSE.on) { if (e.key === 'Enter' && !e.repeat) resumeGame(); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } keys[e.key.toLowerCase()] = true; if (!e.repeat) { const hk = e.key.toLowerCase(); if (hk === 'b') healStart('band'); else if (hk === 'v') healStart('medk'); } if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if ((e.key === 'j' || e.key === ' ') && atk.kb) { atk.kb = false; relAtk(); } });
  addEventListener('keydown', e => { if (!MENU.on && !PAUSE.on && (e.key === 'j' || e.key === ' ') && !e.repeat && !atk.kb) { atk.kb = true; pressAtk(); } });
  addEventListener('keydown', e => { if (MENU.on || PAUSE.on || e.repeat) return; const k = e.key.toLowerCase(); if (k === 'k') BOW.kb = true; else if (k === 'b') { if (!BOW.has) bowGive(); else BOW.ammo = Math.min(BOW_MAX, BOW.ammo + 6); } });   // K = yay (masaüstü) · B = test: yay ver / +6 ok
  addEventListener('keyup', e => { if (e.key.toLowerCase() === 'k') BOW.kb = false; });

  /* ---------- Karakter: animasyonlu, sade, karşıdan görünüm ---------- */
  const HS = 1.6;                 // karakterin görsel ölçeği
  const TIRE_RISE = 0.10;         // tam hızda koşarken saniyede artan yorgunluk (1 = bitkin)
  const REC_IDLE = 0.07, REC_WALK = 0.05; // dururken / yürürken toparlanma hızı
  const COUGH_AT = 0.45;          // bu yorgunluğun üstünde dururken ara sıra öksürür
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap = a => { while (a > Math.PI) a -= 6.2832; while (a < -Math.PI) a += 6.2832; return a; };
  const dmp = (k, dt) => 1 - Math.exp(-k * dt), rnd = (a, b) => a + Math.random() * (b - a);
  const PI = Math.PI, TAU = 6.2832;

  /* ---------- SES: tamamen sentezlenir (ses dosyası yok) · müzik, efektler, Doppler'lı heykel sesleri, fısıltılar ---------- */
  const AU = (() => {
    let ac = null, master, sfxBus, musBus, padBus, padLP, melBus, revIn, noiseBuf, muted = false, acc = 0;
    let gameGate, menuGate, menuBus, menuPad, menuMel, menuRev, deathGate, deathBus, deathRev, mode = 'menu';   // müzik modu: 'menu' (ana menü + duraklatma) · 'game' · 'none'
    const LS = { x: 0, y: 0 }, btn = { x: 0, y: 0, r: 20, mt: 1, pop: 0, ring: 0 }, voices = new Map(), bad = new Set();
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const C_SND = 1500;            // oyun içi 'ses hızı' (px/sn): Doppler kayması net duyulsun diye düşük tutuldu
    const MV = 0.4, SVL = 0.85;  // müzik / efekt seviyesi
    const VOL = { mus: 1, sfx: 1 }; let musRev = null;   // oyuncunun duraklatma menüsünden ayarladığı çarpanlar (0–1)
    try { const j = JSON.parse(localStorage.getItem('hlk_vol') || 'null'); if (j) for (const k of ['mus', 'sfx']) { const v = parseFloat(j[k]); if (isFinite(v)) VOL[k] = Math.min(1, Math.max(0, v)); } } catch (_) {}

    /* ----- temel yapı taşları ----- */
    function tone(d, type, f0, f1, t, dur, vol, o) {
      o = o || {}; const os = ac.createOscillator(), g = ac.createGain(), att = Math.min(o.att || 0.005, dur * 0.9);
      os.type = type; os.frequency.setValueAtTime(f0, t); if (f1 !== f0) os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.1); }
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); f.connect(g); } else os.connect(g);
      g.connect(d); os.start(t); os.stop(t + dur + 0.05);
    }
    function nz(d, t, dur, vol, ft, f0, f1, q, att) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); att = Math.min(att || 0.004, dur * 0.9);
      s.buffer = noiseBuf; s.loop = true; f.type = ft; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
    // konumlu çıkış: mesafeye göre kısılır / matlaşır, soldan sağdan gelir
    function bus(x, y, rev) {
      let pan = 0, g = 1, cut = 16000;
      if (x !== undefined) { const dx = x - LS.x, dy = y - LS.y, dd = Math.hypot(dx, dy); if (dd > 950) return null; g = 1 / (1 + (dd / 230) * (dd / 230)); pan = clamp(dx / 330, -1, 1) * 0.85; cut = Math.min(16000, 700 + 15000 / Math.pow(1 + dd / 110, 1.5)); }
      const gn = ac.createGain(), lp = ac.createBiquadFilter(); gn.gain.value = g; lp.type = 'lowpass'; lp.frequency.value = cut; gn.connect(lp);
      let tail = lp; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; lp.connect(p); tail = p; }
      tail.connect(sfxBus); if (rev > 0) { const r = ac.createGain(); r.gain.value = rev * VOL.sfx; tail.connect(r); r.connect(revIn); }
      return gn;
    }

    /* ----- efektler ----- */
    const SFX = {
      swing(d, t) { nz(d, t, 0.24, 0.5, 'bandpass', 450, 2800, 1.1, 0.08); tone(d, 'sine', 230, 130, t, 0.2, 0.08); },
      hit(d, t, kill) {   // kılıç düşmana isabet etti
        tone(d, 'sine', 190, 55, t, 0.18, 0.9); nz(d, t, 0.1, 0.55, 'highpass', 1800, 2500, 0.7); nz(d, t, 0.2, 0.45, 'bandpass', 1100, 280, 1.4);
        tone(d, 'sawtooth', 420, 110, t, 0.16, 0.2, { lp: 1200 });
        if (kill) { tone(d, 'sine', 100, 32, t, 0.5, 0.8); tone(d, 'triangle', 640, 150, t, 0.35, 0.2); }
      },
      hurt(d, t) {        // biz hasar aldık
        tone(d, 'sine', 160, 42, t, 0.32, 1.0); nz(d, t, 0.28, 0.8, 'lowpass', 900, 180, 0.8); nz(d, t, 0.06, 0.5, 'highpass', 2000, 2000, 0.7);
        tone(d, 'sawtooth', 340, 85, t, 0.38, 0.3, { lp: 900 }); tone(d, 'sine', 2300, 2250, t + 0.02, 0.7, 0.03, { att: 0.02 });   // hafif kulak çınlaması
      },
      block(d, t) {
        [[1180, 0.5, 0.4], [1760, 0.32, 0.3], [2650, 0.2, 0.22], [3480, 0.1, 0.15]].forEach(([f, v, dd]) => tone(d, 'sine', f, f * 0.995, t, dd, v * 0.5));
        nz(d, t, 0.05, 0.5, 'highpass', 3000, 3000, 0.7); tone(d, 'sine', 210, 120, t, 0.1, 0.5);
      },
      stoneHit(d, t, pw) {   // büyülü taşa vuruş: sert taş darbesi + mavi büyü çınlaması (art arda vuruşlarda daha tiz ve uzun)
        const p = pw || 0, k = 1 + p * 0.5;
        tone(d, 'sine', 140, 52, t, 0.16, 0.8); nz(d, t, 0.09, 0.65, 'bandpass', 800, 300, 1.4); nz(d, t, 0.04, 0.4, 'highpass', 2600, 2600, 0.7); tone(d, 'triangle', 460, 210, t, 0.08, 0.2);
        [[880, 0.45, 0.5], [1320, 0.3, 0.45], [1980, 0.22, 0.4], [2960, 0.12, 0.3]].forEach(([f, v, dd], i) => tone(d, 'sine', f * k, f * k * 0.995, t + 0.015 + i * 0.025, dd + p * 0.5, v * (0.5 + 0.2 * p)));
      },
      dust(d, t, a) { [2400, 3100, 4000].forEach((f, i) => tone(d, 'sine', f * (1 + (a || 0) * 0.12), f, t + i * 0.025, 0.13, 0.06)); nz(d, t, 0.03, 0.12, 'highpass', 5200, 5200, 0.7); },   // altın tozu: ince parıltı
      smeltStart(d, t) { nz(d, t, 0.8, 0.5, 'bandpass', 500, 1900, 1.0); tone(d, 'sawtooth', 90, 150, t, 0.7, 0.14, { lp: 500 }); [1500, 2300].forEach((f, i) => tone(d, 'sine', f, f, t + 0.1 + i * 0.07, 0.4, 0.07)); },
      ingot(d, t) { [880, 1320, 1760, 2640].forEach((f, i) => tone(d, 'sine', f, f * 0.998, t + i * 0.03, 0.9, 0.17)); nz(d, t, 0.05, 0.4, 'highpass', 3000, 3000, 0.7); tone(d, 'sine', 200, 90, t, 0.2, 0.5); },
      guardBreak(d, t) {
        SFX.block(d, t); nz(d, t, 0.5, 0.9, 'lowpass', 2400, 260, 0.8); tone(d, 'sawtooth', 240, 48, t, 0.55, 0.5, { lp: 700 });
        for (let i = 0; i < 5; i++) tone(d, 'sine', 2400 + Math.random() * 3000, 2000, t + 0.03 + i * 0.04, 0.2, 0.07);
      },
      playerDeath(d, t) {
        tone(d, 'sine', 130, 28, t, 1.6, 1.0, { att: 0.02 }); nz(d, t, 1.2, 0.6, 'lowpass', 900, 100, 0.7);
        [220, 261.6, 329.6].forEach(f => tone(d, 'triangle', f, f * 0.5, t + 0.1, 1.8, 0.12, { att: 0.2, lp: 1200 }));
      },
      chestHit(d, t, h) { tone(d, 'sine', 150, 60, t, 0.14, 0.8); nz(d, t, 0.12, 0.7, 'bandpass', 900, 300, 1.2); nz(d, t, 0.05, 0.4, 'highpass', 2400, 2400, 0.7); tone(d, 'triangle', 520 + (h || 0) * 60, 260, t, 0.09, 0.2); [1900, 2500].forEach((f, i) => tone(d, 'sine', f, f * 0.99, t + 0.01 + i * 0.02, 0.25, 0.06)); },

  /* --- sırtta taşıma: yay çapraz asılı, yanında sadece oklu bir sadak --- */

  /* --- oklar: uçuş, isabet, düşme --- */
  function bowTarget() {   // en yakın görünür düşman (yoksa en yakın kötücül heykel); mevcut hedef biraz tercih edilir
    let b = null, bd = BOW_LOCK;

  function arrowEnd(i, rec) {   // ok yere iner: şansa bağlı toplanabilir, değilse solan bir iz bırakır
    const a = AR[i]; AR.splice(i, 1);

  /* --- güncelleme: durum makinesi (idle → draw → rel) --- */
  function updateBow(dt) {
    const B = BOW;
    B.vt += dt; B.vib = Math.max(0, B.vib - dt * 3.2); B.gain = Math.max(0, B.gain - dt * 2.5); B.warn = Math.max(0, B.warn - dt * 1.5); B.dry = Math.max(0, B.dry - dt * 3); B.rip = Math.max(0, B.rip - dt * 2.4); B.ring = Math.max(0, B.ring - dt * 2);
    B.slot += ((G.has ? 1 : 0) - B.slot) * dmp(8, dt);
    updateArrows(dt);
    if (!B.has) return;
    if (DEV.arrows) B.ammo = BOW_MAX;   // geliştirici: sınırsız ok
    const dead = F.death >= 0, held = B.down || B.kb, press = held && !dead;
    if (!held) B.latch = false;
    if (dead && (B.st !== 'idle' || B.out > 0)) { B.st = 'idle'; B.ch = 0; B.full = false; B.hold = 0; B.idleT = 99; }
    B.recov = Math.max(0, B.recov - dt);
    const can = !dead && (!G.has || G.eq >= 1) && F.pt < 0 && !F.guarding && F.broken <= 0 && B.recov <= 0;
    if (B.st === 'idle' && press && can) {
      B.idleT = 0;
      if (B.ammo > 0) { B.st = 'draw'; B.ch = 0; B.full = false; B.hold = 0; B.perf = 0; B.aim = hero.face; AU.sfx('bowDraw'); }
      else if (!B.latch) { B.latch = true; B.dry = 1; AU.sfx('bowEmpty'); ftext(player.x, player.y - 62, 'Ok yok', null); }
    } else if (B.st === 'idle' && !press) B.idleT += dt * (hero.run > 0.8 ? 6 : 1);   // koşarken yay çabuk sırta döner
    if (B.st === 'draw') {
      B.idleT = 0; B.ch = Math.min(1, B.ch + dt / (BOW_DRAW * gearM('bowDraw')));

        else { B.hold += dt; B.perf = Math.max(0, B.perf - dt); }

        const t = bowTarget(), A = t ? Math.atan2(t.y - player.y, t.x - player.x) : hero.face; B.tgt = t;
        if (!t && B.st === 'draw' && !B.nw) { B.nw = true; ftext(player.x, player.y - 62, 'Yakında düşman yok', '#ff7a6b'); }   // menzilde hedef yok: her gerişte bir kez uyar (ok yine de bakılan yöne gider)

    }
  }

  /* --- kötücül heykel ganimeti: kırılınca şansa bağlı altın tozu + birkaç mor prizma; tılsımlar yalnızca buradan düşer ---

      const S = !isEn ? (EN.kind === 'hero' || EN.kind === 'armor' || EN.kind === 'gear' ? clamp(phF * 0.0175, 2.9, 4.6) : EN.kind === 'evil' ? clamp(phF * 1.1 / 215, 0.7, 1.05) : Math.min(clamp(cw / 270, 1.1, 1.7), (phF * 0.8 - 10) / 98)) : RH.ei === 0 ? 1.5 * kS : RH.ei === 1 ? 1.8 * kS : clamp(phF * 1.1 / 215, 0.7, 1.05);
      ctx.save(); ctx.beginPath(); ctx.rect(0, pY, W, phF); ctx.clip(); ctx.globalAlpha *= CA;
      const R = Math.max(cw * 0.55, 150), g = ctx.createRadialGradient(W / 2, gy - phF * 0.25, 0, W / 2, gy - phF * 0.25, R); g.addColorStop(0, tint(0.075)); g.addColorStop(1, tint(0)); ctx.fillStyle = g; ctx.fillRect(0, pY, W, phF);
      ctx.save(); ctx.translate(W / 2, gy + 4); ctx.scale(1, 0.16); ctx.strokeStyle = tint(0.1); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, cw * 0.36, 0, TAU); ctx.stroke(); ctx.restore();
      if (sc) { if (isEn) rhDraw(sc, W / 2, gy, S, fg); else rhDrawW(sc, W / 2, gy, S, fg, bgRGB); if (sc.cap !== RH.capS) { RH.capA -= dt / 0.14; if (RH.capA <= 0) { RH.capA = 0; RH.capS = sc.cap; } } else RH.capA = Math.min(1, RH.capA + dt / 0.2); }
      ctx.save(); ctx.globalAlpha *= RH.capA; dvText(RH.capS, W / 2, pY + phF - 8, 12, 500, fg, 0.55, 1.2, 'center'); ctx.restore();
      // mod düğmesi: öfke aç/kapat · heykelde hasar kademesi
      if (isEn || EN.kind === 'evil') { const bw = 108, bh = 28, bx = x0 + cw - bw, byy = pY + 4, rageOn = RH.rage, label = isEn && EN.mode === 'rage' ? (rageOn ? 'ÖFKE  AÇIK' : 'ÖFKE  KAPALI') : 'HASAR  ' + RH.hits + ' / 4';
        menuPill(bx, byy, bw, bh, label, 1, false, 0, isEn && EN.mode === 'rage' ? (rageOn ? RH_RED : undefined) : (RH.hits > 0 ? RH_RED : undefined));
        PAUSE.btns.push({ x: bx - 6, y: byy - 6, w: bw + 12, h: bh + 12, fn: () => {
          if (!RH.sc) return; if (isEn && EN.mode === 'rage') { RH.rage = !RH.rage; RH.sc.e.rage = RH.sc.e.rg = RH.rage; if (RH.sc.play) { const k = RH.sc.play.k; rhPlay(k); } }
          else { RH.hits = (RH.hits + 1) % 5; const s = RH.sc.s; s.hits = RH.hits; s.hp = EV_HP * (1 - RH.hits / 5); s.flash = 0.14; s.flare = 0.8; s.pulse = 0.6; s.rv += 0.9; } } }); }
      ctx.restore(); hair(pY + phF, 0.07); vt = pY + phF + 1; }
    ctx.save(); ctx.beginPath(); ctx.rect(0, vt, W, H - vt); ctx.clip(); ctx.translate(0, -RH.scroll);
    let y = vt + 4;
    // --- ad · alt başlık · açıklama
    begin(); y += 14; dvText(EN.name, x0, y + 20, 31, 300, fg, 1, 0.4, 'left'); y += 42; dvText(EN.sub, x0, y + 7, 11, 500, fg, 0.42, 2.6, 'left'); y += 24; end();
    begin(); y = rhPara(EN.lore, x0, y, 14, 400, fg, 0.64, cw, 22) + 26; end();
    // --- özellikler
    begin(); dvText('ÖZELLİKLER', x0, y + 7, 11, 500, fg, 0.4, 3, 'left'); y += 20; hair(y, 0.09); end();
    EN.stats.forEach(s => { begin(); dvText(s[0], x0, y + 20, 14, 400, fg, 0.5, 0, 'left'); dvText(s[1], x0 + cw, y + 20, 14, 500, fg, 0.95, 0, 'right'); y += 40; hair(y, 0.07); end(); });
    // --- saldırılar / yetenekler: dokununca önizlemede oynar
    begin(); y += 28; dvText(EN.atkTitle, x0, y + 7, 11, 500, fg, 0.4, 3, 'left'); if (!EN.noplay) dvText('dokun  ·  önizlemede izle', x0 + cw, y + 7, 11, 400, fg, 0.3, 0.4, 'right'); y += 20; hair(y, 0.09); end();
    EN.atks.forEach((a, k) => {
      begin(); const y1 = y, sel = RH.sc && RH.sc.sel === k, dim = sel ? 1 : 0.82; y += 16;
      if (sel) { ctx.fillStyle = tint(0.9); ctx.beginPath(); ctx.arc(x0 - 9, y + 11, 2.4, 0, TAU); ctx.fill(); }
      dvText(a[0], x0, y + 11, 17, 600, fg, dim, 0.2, 'left'); if (a[2] !== '—') dvText(a[2], x0 + cw, y + 11, 13.5, 600, RH_RED, 0.95, 0.3, 'right'); y += 28;
      y = rhPara(a[1], x0, y, 13.5, 400, fg, 0.58 * dim + 0.1, cw, 20.5) + 4; dvText(a[3], x0, y + 10, 11.5, 400, fg, 0.36, 0.4, 'left'); y += 28; hair(y, 0.07); end();
      const by = y1 - RH.scroll, hh2 = y - y1; if (!EN.noplay && by + hh2 > vt && by < H) PAUSE.btns.push({ x: x0 - 12, y: Math.max(by, vt), w: cw + 24, h: hh2, fn: () => rhPlay(k) });
    });
    // --- ipuçları
    begin(); y += 28; dvText('İPUÇLARI', x0, y + 7, 11, 500, fg, 0.4, 3, 'left'); y += 20; hair(y, 0.09); y += 6; end();
    EN.tips.forEach(t => { begin(); y += 10; ctx.fillStyle = tint(0.5); ctx.beginPath(); ctx.arc(x0 + 3, y + 11, 1.7, 0, TAU); ctx.fill(); y = rhPara(t, x0 + 16, y, 13.5, 400, fg, 0.64, cw - 16, 20.5) + 8; end(); });
    y += 40; ctx.restore(); RH.max = Math.max(0, y - H);
    { const f1 = ctx.createLinearGradient(0, vt, 0, vt + 26); f1.addColorStop(0, `rgba(${bgRGB},1)`); f1.addColorStop(1, `rgba(${bgRGB},0)`); ctx.fillStyle = f1; ctx.fillRect(0, vt, W, 26);
      const f2 = ctx.createLinearGradient(0, H - 34, 0, H); f2.addColorStop(0, `rgba(${bgRGB},0)`); f2.addColorStop(1, `rgba(${bgRGB},1)`); ctx.fillStyle = f2; ctx.fillRect(0, H - 34, W, 34); }
    if (RH.tg > RH.max) RH.tg = RH.max;
  }

  /* ---------- Sayfa geçişi: menü / duraklatma sayfaları arasında önceki kare yumuşakça sönerek yeni sayfaya karışır ---------- */
  const TRN = { key: undefined, a: 0, snap: null };
  function trnCapture() { try { if (!TRN.snap) TRN.snap = document.createElement('canvas'); TRN.snap.width = cv.width; TRN.snap.height = cv.height; TRN.snap.getContext('2d').drawImage(cv, 0, 0); TRN.a = 1; } catch (_) { TRN.a = 0; } }
  function trnWatch() {
    const k = (MENU.on ? 'M' : 'G') + (PAUSE.on ? 'P' + PAUSE.page : ''), fam = q => q.indexOf('P') >= 0 || q === 'M';
    if (TRN.key !== undefined && k !== TRN.key && fam(TRN.key) && fam(k)) trnCapture();
    TRN.key = k;
  }
  function trnDraw(dt) {
    if (TRN.a <= 0 || !TRN.snap) return;
    TRN.a = Math.max(0, TRN.a - dt / 0.32); const k = TRN.a;
    ctx.save(); ctx.globalAlpha = k * k * (3 - 2 * k); ctx.drawImage(TRN.snap, 0, 0, W, H); ctx.restore();
  }
  /* ---------- Döngü ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    trnWatch();
    if (MENU.on && PAUSE.on) { try { AU.update(dt, 0); } catch (_) {} drawPause(dt, false); trnDraw(dt); requestAnimationFrame(frame); return; }
    if (MENU.on) { drawMenu(dt); trnDraw(dt); try { AU.update(dt, 0); } catch (_) {} requestAnimationFrame(frame); return; }
    if (PAUSE.on) { try { AU.setMode('menu'); AU.update(dt, 0); } catch (_) {} drawPause(dt, false); trnDraw(dt); requestAnimationFrame(frame); return; }
    const fz = DEV.freeze;   // geliştirici: zamanı dondur (Halaskar dışında her şey durur)
    if (!fz) TM.t += dt;
    const stopped = FX.stop > 0; if (stopped) FX.stop -= dt;
    const sdt = stopped ? dt * 0.04 : dt;   // vuruş duraklaması: oyun neredeyse donar

    let ix = joy.dx, iy = joy.dy;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    if (F.death >= 0 || (F.kd >= 0 && F.kd < 2.1)) ix = iy = 0;
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    if (keys['shift']) { const mm = Math.hypot(ix, iy); if (mm > 0.45) { ix *= 0.45 / mm; iy *= 0.45 / mm; } } // Shift = yürü (masaüstü testi)

    // yumuşak ivmelenme
    const t = 1 - Math.exp(-14 * sdt), spd = SPEED * gearM('speed') * (F.guarding ? 0.75 + gearA('guard') : 1) * (1 - 0.45 * BOW.aimw) * (F.kd >= 2.1 ? 0.5 : 1) * (HEAL.use && HEAL.use.ph === 'wrap' ? 0.5 : 1) * (1 - 0.7 * Math.min(F.slow, 2) / 2);   // siperdeyken yavaş
    player.vx += (ix * spd - player.vx) * t;
    player.vy += (iy * spd - player.vy) * t;
    player.x += player.vx * sdt; player.y += player.vy * sdt;
    collideStatues(); collideChests(); collideCamps();
    if (Math.hypot(player.vx, player.vy) > 12) player.angle = Math.atan2(player.vy, player.vx);

    updateHero(sdt);
    updateGun(sdt);
    updateFight(sdt);
    updateBow(sdt); updateHeal(sdt); updateCamp(sdt);
    if (fz) for (const e of E) { e.flash = Math.max(0, e.flash - dt); e.hf = Math.max(0, (e.hf || 0) - dt * 6); e.sf = Math.max(0, (e.sf || 0) - dt * 4); }   // donmuşken de vuruş parlaması sönsün
    updateEnemies(fz ? 0 : sdt);   // donmuşken yalnızca ölmekte olanlar oynar
    campBarrier();
    updateBolts(fz ? 0 : sdt);
    updateEvil(fz ? 0 : sdt); updateChests(sdt);
    { const ft0 = FX.t; updateFx(dt, sdt); if (fz) FX.t = ft0; }
    let alert = 0; for (const e of E) if (e.em >= 1 && Math.hypot(e.x - player.x, e.y - player.y) < 460) alert += e.st === 'wind' || e.st === 'strike' ? 0.3 : 0.18;
    try { AU.setMode(F.death >= 0.6 ? 'death' : 'game'); AU.setListener(player.x, player.y); AU.update(dt, CAMP.in ? 0 : clamp(alert, 0, 1)); } catch (_) {}   // müzik yoğunluğu çatışmayla yükselir; heykel sesleri / Doppler

    joy.alpha += ((joy.active ? 1 : 0) - joy.alpha) * (1 - Math.exp(-16 * dt));

    // çizim
    const bgCol = light ? '#f2f2f2' : '#0a0a0a';
    const fg = light ? '0,0,0' : '255,255,255';
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H);
    const ck = dmp(10, dt); cam.x += (player.x - W / 2 - cam.x) * ck; cam.y += (player.y - H / 2 - cam.y) * ck;   // kamera yumuşak takip
    cam.x += FX.ox; cam.y += FX.oy;   // kamera sarsıntısı
    drawWorld(fg);
    setBase();
    drawPrints(fg);
    drawTele(fg);

    drawGroundGun(fg, light);
    const campV = campsIn(cam.x - 400, cam.y - 400, cam.x + W + 400, cam.y + H + 400); drawCampGround(campV, fg);
    const sfg = light ? '105,105,105' : '150,150,150';
    const sObjs = statuesIn(cam.x - 80, cam.y - 20, cam.x + W + 80, cam.y + H + 140).map(([x, y, id, ev]) => ({ y, f: ev ? () => drawEvil(x, y, id, light) : () => drawStatue(x, y, SS, sfg, light) }));
    const cObjs = chestsIn(cam.x - 80, cam.y - 20, cam.x + W + 80, cam.y + H + 140).map(([x, y, id, lk]) => ({ y, f: () => drawChest(x, y, id, lk, light) })).concat(LOOT.map(l => ({ y: l.y, f: () => drawLoot(l) })));
    const eObjs = E.map(e => ({ y: e.y, f: () => drawEnemy(e, fg) })).concat(EP.map(p => ({ y: p.y, f: () => drawBolt(p, fg) }))), kObjs = campV.flatMap(c => campObjs(c, fg, light)), allO = sObjs.concat(eObjs, cObjs, kObjs).sort((a, b) => a.y - b.y);
    allO.filter(o => o.y < player.y).forEach(o => o.f());
    drawBowAim(fg);
    ctx.globalAlpha = F.flash > 0 && Math.floor(F.time * 30) % 2 ? 0.4 : 1;   // hasar alınca yanıp söner
    drawHero(fg, light);
    ctx.globalAlpha = 1;
    drawSlash(fg);
    drawSparks(fg); drawHealFx();
    allO.filter(o => o.y >= player.y).forEach(o => o.f());
    drawArrows(fg); drawCampShield(campV);
    drawSmoke(light); drawShards(light); drawDebris(light); drawWood(); drawChestPieces(light); drawChestFx(light); drawRings(); drawDmgNums(fg); drawFT(fg);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (light) {
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(0,0,0,0.7)';
      debugLines().forEach((t, i) => ctx.fillText(t, 20, 90 + i * 16));
    }

    if (F.dp > 0.01) { ctx.fillStyle = light ? `rgba(242,242,242,${0.4 * F.dp})` : `rgba(0,0,0,${0.45 * F.dp})`; ctx.fillRect(0, 0, W, H); }   // ölümde ekran kararır
    // joystick
    if (joy.alpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = joy.alpha;
      const bg = ctx.createRadialGradient(joy.bx, joy.by, joy.R * 0.2, joy.bx, joy.by, joy.R);
      bg.addColorStop(0, `rgba(${fg},0.03)`);
      bg.addColorStop(1, `rgba(${fg},0.12)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${fg},0.28)`; ctx.stroke();

      const kg = ctx.createRadialGradient(joy.kx - 6, joy.ky - 8, 2, joy.kx, joy.ky, 28);
      kg.addColorStop(0, `rgba(${fg},0.55)`);
      kg.addColorStop(1, `rgba(${fg},0.22)`);
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 27, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.stroke();
      ctx.restore();
    }
    drawHud(fg); drawBowHud(fg); drawTimer(fg, dt); drawHealHud(fg, dt); drawDevHp(fg, dt); drawCampHud(fg, dt);
    drawAtk(fg, dt); drawBowBtn(fg, dt); drawHealBtns(fg, dt); drawPauseBtn(fg, dt);
    if (PAUSE.a > 0) drawPause(dt, true);
    if (DEATH.on) drawDeath(dt, fg);
    if (MENU.blk > 0) { MENU.blk = Math.max(0, MENU.blk - dt / 0.7); ctx.fillStyle = `rgba(0,0,0,${MENU.blk})`; ctx.fillRect(0, 0, W, H); }   // karartmadan açılış
    cam.x -= FX.ox; cam.y -= FX.oy;
    requestAnimationFrame(frame);
  }

  addEventListener('scroll', () => { if (scrollX || scrollY) scrollTo(0, 0); });
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();
  try { const a = sessionStorage.getItem('hlk_auto'); if (a) { sessionStorage.removeItem('hlk_auto'); menuStart(a === 'c'); } } catch (_) {}   // ölüm ekranından 'kayıttan devam / yeni oyun'
  requestAnimationFrame(frame);
})();
