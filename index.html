<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oyun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: relative; margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; background: #000; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0 };
  const atk = { id: null, down: false, kb: false, x: 0, y: 0, r: 42, vis: 0, rip: 0, was: false, spin: 0 };   // saldırı butonu (vis: 0 = yok, 1 = tam görünür)
  const setBase = () => ctx.setTransform(DPR, 0, 0, DPR, -cam.x * DPR, -cam.y * DPR);   // dünya -> ekran

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı (home indicator) hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (H > W && full > H) H = full;
    }
    const de = document.documentElement.style, bs = document.body.style;
    de.height = H + 'px'; bs.width = W + 'px'; bs.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cam.x = player.x - W / 2; cam.y = player.y - H / 2;
  }

  /* ---------- Hata ayıklama bilgisi (açık zemin modunda görünür) ---------- */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function debugLines() {
    const sab = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    return [
      'tuval ' + W + 'x' + H,
      'inner ' + innerWidth + 'x' + innerHeight,
      'screen ' + screen.width + 'x' + screen.height,
      '100vh ' + probe.getBoundingClientRect().height,
      'alt guvenli alan ' + sab,
      'ust guvenli alan ' + (parseFloat(getComputedStyle(probe).paddingTop) || 0),
      'vv ' + (window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '-'),
      'scrollY ' + scrollY,
      'standalone ' + navigator.standalone
    ];
  }

  /* ---------- Oyuncu ---------- */
  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, angle: -Math.PI / 2 };
  const SPEED = 230;

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  function toggleBg() {
    light = !light;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      toggleBg(); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  function joyStart(e) {
    AU.unlock();
    if (MENU.on && PAUSE.on) { pauseDown(e); return; }   // ana menüden açılan kıyafet sayfası
    if (MENU.on) { if (MENU.t > 0.6) menuTap(e.clientX, e.clientY); return; }   // ana menü açıkken dokunuşlar yalnızca menüye gider
    if (PAUSE.on) { pauseDown(e); return; }   // duraklatılmışken dokunuşlar yalnızca menüye gider
    if (Math.hypot(e.clientX - AU.btn.x, e.clientY - AU.btn.y) < AU.btn.r + 14) { togglePause(); return; }   // duraklatma düğmesi
    if (atk.id === null && atkActive() && Math.hypot(e.clientX - atk.x, e.clientY - atk.y) < atk.r + 14) {   // buton joystick'ten önceliklidir
      atk.id = e.pointerId; atk.down = true; pressAtk();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (BOW.id === null && BOW.has && BOW.vv > 0.6 && Math.hypot(e.clientX - BOW.bx, e.clientY - BOW.by) < BOW.r + 14) {   // yay düğmesi
      BOW.id = e.pointerId; BOW.down = true;
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY;
    joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { // taban parmağı takip eder
      const k = (d - joy.R) / d;
      joy.bx += dx * k; joy.by += dy * k;
      dx = e.clientX - joy.bx; dy = e.clientY - joy.by;
    }
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
    joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId === BOW.id) { BOW.id = null; BOW.down = false; return; }
    if (e.pointerId === atk.id) { atk.id = null; atk.down = false; relAtk(); return; }
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0;
    joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => { if (MENU.on) { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'j') && MENU.t > 0.6) menuStart(); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } if (e.key === 'Escape' && PAUSE.on && PAUSE.page !== 'main') { PAUSE.page = 'main'; return; } if ((e.key.toLowerCase() === 'p' || e.key === 'Escape') && !e.repeat) { togglePause(); return; } if (PAUSE.on) { if (e.key === 'Enter' && !e.repeat) resumeGame(); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if ((e.key === 'j' || e.key === ' ') && atk.kb) { atk.kb = false; relAtk(); } });
  addEventListener('keydown', e => { if (!MENU.on && !PAUSE.on && (e.key === 'j' || e.key === ' ') && !e.repeat && !atk.kb) { atk.kb = true; pressAtk(); } });
  addEventListener('keydown', e => { if (MENU.on || PAUSE.on || e.repeat) return; const k = e.key.toLowerCase(); if (k === 'k') BOW.kb = true; else if (k === 'b') { if (!BOW.has) bowGive(); else BOW.ammo = Math.min(BOW_MAX, BOW.ammo + 6); } });   // K = yay (masaüstü) · B = test: yay ver / +6 ok
  addEventListener('keyup', e => { if (e.key.toLowerCase() === 'k') BOW.kb = false; });

  /* ---------- Karakter: animasyonlu, sade, karşıdan görünüm ---------- */
  const HS = 1.6;                 // karakterin görsel ölçeği
  const TIRE_RISE = 0.10;         // tam hızda koşarken saniyede artan yorgunluk (1 = bitkin)
  const REC_IDLE = 0.07, REC_WALK = 0.05; // dururken / yürürken toparlanma hızı
  const COUGH_AT = 0.45;          // bu yorgunluğun üstünde dururken ara sıra öksürür
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap = a => { while (a > Math.PI) a -= 6.2832; while (a < -Math.PI) a += 6.2832; return a; };
  const dmp = (k, dt) => 1 - Math.exp(-k * dt), rnd = (a, b) => a + Math.random() * (b - a);
  const PI = Math.PI, TAU = 6.2832;

  /* ---------- SES: tamamen sentezlenir (ses dosyası yok) · müzik, efektler, Doppler'lı heykel sesleri, fısıltılar ---------- */
  const AU = (() => {
    let ac = null, master, sfxBus, musBus, padBus, padLP, melBus, revIn, noiseBuf, muted = false, acc = 0;
    let gameGate, menuGate, menuBus, menuPad, menuMel, menuRev, mode = 'menu';   // müzik modu: 'menu' (ana menü + duraklatma) · 'game' · 'none'
    const LS = { x: 0, y: 0 }, btn = { x: 0, y: 0, r: 20, mt: 1, pop: 0, ring: 0 }, voices = new Map(), bad = new Set();
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const C_SND = 1500;            // oyun içi 'ses hızı' (px/sn): Doppler kayması net duyulsun diye düşük tutuldu
    const MV = 0.4, SVL = 0.85;  // müzik / efekt seviyesi
    const VOL = { mus: 1, sfx: 1 }; let musRev = null;   // oyuncunun duraklatma menüsünden ayarladığı çarpanlar (0–1)
    try { const j = JSON.parse(localStorage.getItem('hlk_vol') || 'null'); if (j) for (const k of ['mus', 'sfx']) { const v = parseFloat(j[k]); if (isFinite(v)) VOL[k] = Math.min(1, Math.max(0, v)); } } catch (_) {}

    /* ----- temel yapı taşları ----- */
    function tone(d, type, f0, f1, t, dur, vol, o) {
      o = o || {}; const os = ac.createOscillator(), g = ac.createGain(), att = Math.min(o.att || 0.005, dur * 0.9);
      os.type = type; os.frequency.setValueAtTime(f0, t); if (f1 !== f0) os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.1); }
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); f.connect(g); } else os.connect(g);
      g.connect(d); os.start(t); os.stop(t + dur + 0.05);
    }
    function nz(d, t, dur, vol, ft, f0, f1, q, att) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); att = Math.min(att || 0.004, dur * 0.9);
      s.buffer = noiseBuf; s.loop = true; f.type = ft; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
    // konumlu çıkış: mesafeye göre kısılır / matlaşır, soldan sağdan gelir
    function bus(x, y, rev) {
      let pan = 0, g = 1, cut = 16000;
      if (x !== undefined) { const dx = x - LS.x, dy = y - LS.y, dd = Math.hypot(dx, dy); if (dd > 950) return null; g = 1 / (1 + (dd / 230) * (dd / 230)); pan = clamp(dx / 330, -1, 1) * 0.85; cut = Math.min(16000, 700 + 15000 / Math.pow(1 + dd / 110, 1.5)); }
      const gn = ac.createGain(), lp = ac.createBiquadFilter(); gn.gain.value = g; lp.type = 'lowpass'; lp.frequency.value = cut; gn.connect(lp);
      let tail = lp; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; lp.connect(p); tail = p; }
      tail.connect(sfxBus); if (rev > 0) { const r = ac.createGain(); r.gain.value = rev * VOL.sfx; tail.connect(r); r.connect(revIn); }
      return gn;
    }

    /* ----- efektler ----- */
    const SFX = {
      swing(d, t) { nz(d, t, 0.24, 0.5, 'bandpass', 450, 2800, 1.1, 0.08); tone(d, 'sine', 230, 130, t, 0.2, 0.08); },
      hit(d, t, kill) {   // kılıç düşmana isabet etti
        tone(d, 'sine', 190, 55, t, 0.18, 0.9); nz(d, t, 0.1, 0.55, 'highpass', 1800, 2500, 0.7); nz(d, t, 0.2, 0.45, 'bandpass', 1100, 280, 1.4);
        tone(d, 'sawtooth', 420, 110, t, 0.16, 0.2, { lp: 1200 });
        if (kill) { tone(d, 'sine', 100, 32, t, 0.5, 0.8); tone(d, 'triangle', 640, 150, t, 0.35, 0.2); }
      },
      hurt(d, t) {        // biz hasar aldık
        tone(d, 'sine', 160, 42, t, 0.32, 1.0); nz(d, t, 0.28, 0.8, 'lowpass', 900, 180, 0.8); nz(d, t, 0.06, 0.5, 'highpass', 2000, 2000, 0.7);
        tone(d, 'sawtooth', 340, 85, t, 0.38, 0.3, { lp: 900 }); tone(d, 'sine', 2300, 2250, t + 0.02, 0.7, 0.03, { att: 0.02 });   // hafif kulak çınlaması
      },
      block(d, t) {
        [[1180, 0.5, 0.4], [1760, 0.32, 0.3], [2650, 0.2, 0.22], [3480, 0.1, 0.15]].forEach(([f, v, dd]) => tone(d, 'sine', f, f * 0.995, t, dd, v * 0.5));
        nz(d, t, 0.05, 0.5, 'highpass', 3000, 3000, 0.7); tone(d, 'sine', 210, 120, t, 0.1, 0.5);
      },
      guardBreak(d, t) {
        SFX.block(d, t); nz(d, t, 0.5, 0.9, 'lowpass', 2400, 260, 0.8); tone(d, 'sawtooth', 240, 48, t, 0.55, 0.5, { lp: 700 });
        for (let i = 0; i < 5; i++) tone(d, 'sine', 2400 + Math.random() * 3000, 2000, t + 0.03 + i * 0.04, 0.2, 0.07);
      },
      playerDeath(d, t) {
        tone(d, 'sine', 130, 28, t, 1.6, 1.0, { att: 0.02 }); nz(d, t, 1.2, 0.6, 'lowpass', 900, 100, 0.7);
        [220, 261.6, 329.6].forEach(f => tone(d, 'triangle', f, f * 0.5, t + 0.1, 1.8, 0.12, { att: 0.2, lp: 1200 }));
      },
      chestHit(d, t, h) { tone(d, 'sine', 150, 60, t, 0.14, 0.8); nz(d, t, 0.12, 0.7, 'bandpass', 900, 300, 1.2); nz(d, t, 0.05, 0.4, 'highpass', 2400, 2400, 0.7); tone(d, 'triangle', 520 + (h || 0) * 60, 260, t, 0.09, 0.2); [1900, 2500].forEach((f, i) => tone(d, 'sine', f, f * 0.99, t + 0.01 + i * 0.02, 0.25, 0.06)); },
      chestBreak(d, t) { tone(d, 'sine', 110, 38, t, 0.5, 1.0); nz(d, t, 0.45, 0.9, 'lowpass', 2800, 200, 0.8); for (let i = 0; i < 7; i++) nz(d, t + 0.02 + i * 0.045 + Math.random() * 0.03, 0.06, 0.45, 'bandpass', 500 + Math.random() * 1800, 350, 2.5); [1568, 2093, 2637, 3136].forEach((f, i) => tone(d, 'sine', f, f, t + 0.08 + i * 0.06, 0.6, 0.1)); },
      chainClank(d, t) { nz(d, t, 0.07, 0.55, 'highpass', 3000, 3000, 0.9); [2100, 3150, 4200].forEach((f, i) => tone(d, 'square', f, f * 0.97, t + i * 0.018, 0.14, 0.07, { lp: 6000 })); tone(d, 'sine', 240, 140, t, 0.1, 0.5); },
      unlock(d, t) { [1568, 2349].forEach((f, i) => tone(d, 'sine', f, f, t + i * 0.06, 0.3, 0.15)); nz(d, t, 0.06, 0.5, 'highpass', 3500, 3500, 0.8); tone(d, 'sine', 300, 160, t + 0.03, 0.12, 0.4); nz(d, t + 0.12, 0.35, 0.3, 'bandpass', 2500, 900, 1.4); },
      coin(d, t, a) { const f = 1500 + (a || 0) * 220; tone(d, 'sine', f, f, t, 0.25, 0.14); tone(d, 'sine', f * 1.5, f * 1.5, t + 0.05, 0.4, 0.12); },
      keyGet(d, t) { [880, 1318.5, 1760, 2637].forEach((f, i) => tone(d, 'triangle', f, f, t + i * 0.06, 0.9, 0.14)); nz(d, t, 0.5, 0.3, 'highpass', 4000, 9000, 0.8, 0.03); },
      pickup(d, t) { nz(d, t, 0.4, 0.35, 'highpass', 3500, 9000, 0.8, 0.03); [1318.5, 1760, 2093, 2637].forEach((f, i) => tone(d, 'sine', f, f, t + i * 0.07, 0.8, 0.14)); },
      sheath(d, t) { nz(d, t, 0.05, 0.4, 'bandpass', 3200, 2500, 2); tone(d, 'sine', 900, 500, t, 0.06, 0.25); },
      unsheath(d, t) { nz(d, t, 0.22, 0.3, 'highpass', 2500, 7000, 0.8, 0.02); tone(d, 'sine', 1800, 2600, t, 0.2, 0.05); },
      /* yay sesleri */
      bowDraw(d, t) {   // gergin yay: tahta gıcırtısı, deri sürtünmesi, ok oturur
        tone(d, 'sawtooth', 62, 118, t, 0.7, 0.16, { lp: 320, att: 0.12, vib: [9, 5] }); tone(d, 'triangle', 190, 330, t + 0.05, 0.6, 0.05, { lp: 700, att: 0.2, vib: [14, 12] });
        nz(d, t, 0.7, 0.16, 'bandpass', 500, 1500, 2.2, 0.25); nz(d, t, 0.03, 0.35, 'highpass', 3000, 3000, 0.8);
      },
      bowUnsling(d, t) { nz(d, t, 0.14, 0.3, 'bandpass', 700, 1800, 1.4, 0.04); tone(d, 'sine', 300, 180, t + 0.06, 0.1, 0.2); },
      bowSling(d, t) { nz(d, t, 0.2, 0.28, 'bandpass', 1500, 600, 1.4, 0.05); tone(d, 'sine', 240, 140, t + 0.1, 0.1, 0.18); },
      bowFull(d, t) { tone(d, 'sine', 1850, 1850, t, 0.12, 0.06); tone(d, 'triangle', 2800, 2800, t + 0.03, 0.2, 0.03); nz(d, t, 0.04, 0.25, 'bandpass', 4200, 4200, 3); tone(d, 'sine', 90, 70, t, 0.1, 0.25); },
      bowSlack(d, t) { nz(d, t, 0.18, 0.3, 'bandpass', 1200, 500, 1.2, 0.01); tone(d, 'sine', 210, 120, t, 0.14, 0.18); },
      bowShot(d, t, p) {   // kiriş çınlar, ok vınlar
        p = p || 0; tone(d, 'triangle', 150 + p * 60, 110, t, 0.32, 0.36 + p * 0.2, { vib: [38, 14], att: 0.002 }); tone(d, 'sine', 920 + p * 500, 380, t, 0.1, 0.28);
        nz(d, t, 0.05, 0.5, 'highpass', 2500, 2500, 0.7); nz(d, t + 0.01, 0.22 + p * 0.1, 0.4 + p * 0.2, 'bandpass', 3600, 700, 1.3, 0.01); tone(d, 'sine', 110, 45, t, 0.16, 0.35);
      },
      arrowHit(d, t, kill) { tone(d, 'sine', 170, 55, t, 0.13, 0.7); nz(d, t, 0.09, 0.5, 'lowpass', 2200, 300, 0.9); nz(d, t, 0.035, 0.4, 'highpass', 2800, 2800, 0.8); tone(d, 'triangle', 380, 150, t, 0.1, 0.15); if (kill) tone(d, 'sine', 100, 34, t, 0.4, 0.6); },
      arrowThunk(d, t) { tone(d, 'sine', 210, 90, t, 0.1, 0.35); nz(d, t, 0.06, 0.3, 'bandpass', 1200, 500, 1.5); },

    const scC = cw / 27, tot = nO * cw + (nO - 1) * gC; let x = pcx - tot / 2;
    opts.forEach(k => {
      const on = OUTFIT[WDR.sel] === k;
      ctx.save(); rr(x, y, cw, cw, 16); ctx.clip();
      const gr = ctx.createLinearGradient(0, y, 0, y + cw); gr.addColorStop(0, on ? P.goldBg : P.p3); gr.addColorStop(1, on ? P.goldBg : P.p2); ctx.fillStyle = gr; ctx.fillRect(x, y, cw, cw);
      const sv = {}; for (const q in OUTFIT) { sv[q] = OUTFIT[q]; OUTFIT[q] = null; } OUTFIT[WDR.sel] = k;   // yalnızca bu parça takılıyken çiz
      { const cr = WDC[WDR.sel] || WDC.head, zz = scC * cr.z; wdChar(x + cw / 2, y + cr.gy * zz, zz, PI / 2 - cr.f, t, fg, true, P); }   // kırpma: üst boşlukta uzun şapka sığar, altında yalnızca boyun + göğüs üstü (ileride tılsım/kolye için yer)
      for (const q in sv) OUTFIT[q] = sv[q];
      ctx.restore();
      rr(x, y, cw, cw, 16); ctx.lineWidth = on ? 2 : 1.25; ctx.strokeStyle = on ? P.gold : P.ln; ctx.stroke();
      if (on) { const bx = x + cw - 13, by2 = y + 13; ctx.beginPath(); ctx.arc(bx, by2, 8.5, 0, TAU); ctx.fillStyle = P.gold; ctx.fill(); ctx.strokeStyle = P.ink; ctx.lineWidth = 1.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(bx - 3.6, by2 + 0.2); ctx.lineTo(bx - 1, by2 + 3); ctx.lineTo(bx + 3.8, by2 - 2.8); ctx.stroke(); }
      ctx.font = `600 9px ${UIF}`; ctx.textBaseline = 'middle'; ctx.fillStyle = on ? P.gold : P.dim; wdLetters(k ? GEAR[k].short : 'BOŞ', x + cw / 2, y + cw + 14, 2, 'c');
      const kk = k; PAUSE.btns.push({ x: x - 2, y: y - 2, w: cw + 4, h: cw + 24, fn: () => { if (OUTFIT[WDR.sel] === kk) return; OUTFIT[WDR.sel] = kk; saveOutfit(); try { AU.sfx('pickup'); } catch (_) {} } });
      x += cw + gC;
    });
  }

  function drawPause(dt, over) {
    MENU.fl = Math.max(0, MENU.fl - dt * 2.4);
    PAUSE.a = over ? Math.max(0, PAUSE.a - dt / 0.2) : Math.min(1, PAUSE.a + dt / 0.22);
    const A = PAUSE.a, e = 1 - Math.pow(1 - A, 3), fg = light ? '0,0,0' : '255,255,255', bgRGB = light ? '242,242,242' : '10,10,10', u = clamp(Math.min(W / 390, H / 760), 0.62, 1.35), cx = W / 2;
    if (!over) { ctx.fillStyle = light ? '#f2f2f2' : '#0a0a0a'; ctx.fillRect(0, 0, W, H); if (PAUSE.snap) ctx.drawImage(PAUSE.snap, 0, 0, W, H); }
    ctx.fillStyle = `rgba(${bgRGB},${0.82 * A})`; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = e; ctx.translate(0, (1 - e) * 10);
    if (PAUSE.page === 'wardrobe') { drawWardrobePage(u, cx, fg); ctx.restore(); return; }
    if (DEV.on && PAUSE.page === 'dev') { drawDevPage(u, cx); ctx.restore(); return; }
    const total = (340 + 54 + (DEV.on ? 50 : 0)) * u; let y = Math.max(24, (H - total) / 2 - H * 0.03);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = `500 ${13 * u + 2}px ${UIF}`; ctx.fillStyle = `rgba(${fg},0.7)`;
    const T = 'DURAKLATILDI', ch = [...T], sp = 5, tw = ch.reduce((q, c) => q + ctx.measureText(c).width + sp, -sp); let lx = cx - tw / 2; ctx.textAlign = 'left'; for (const c of ch) { ctx.fillText(c, lx, y + 14 * u); lx += ctx.measureText(c).width + sp; }
    y += 18 * u + 14 * u; ctx.textAlign = 'center'; ctx.font = `200 ${54 * u}px ${UIF}`; ctx.fillStyle = `rgb(${fg})`; ctx.fillText(fmtTime(TM.t), cx, y + 44 * u);
    y += 54 * u + 4 * u; ctx.font = `400 ${11 * u + 1}px ${UIF}`; ctx.fillStyle = `rgba(${fg},0.45)`; ctx.fillText('geçen süre', cx, y + 12 * u);
    y += 12 * u + 28 * u; PAUSE.btns.length = 0; PAUSE.sl.length = 0;
    const bw = Math.min(W * 0.64, 250), bh = 52; menuPill(cx - bw / 2, y, bw, bh, 'DEVAM ET', 1, true, performance.now() / 1000); PAUSE.btns.push({ x: cx - bw / 2, y: y - 4, w: bw, h: bh + 8, fn: resumeGame });
    y += bh + 30 * u; const sw = Math.min(W * 0.78, 300), sx = cx - sw / 2 + 88, slw = sw - 88 - 38;
    pauseSlider(sx, y + 4, slw, 'MÜZİK', 'mus', 1, fg); PAUSE.sl.push({ k: 'mus', x: sx, y: y + 4, w: slw });
    y += 34 * u; pauseSlider(sx, y + 4, slw, 'EFEKT', 'sfx', 1, fg); PAUSE.sl.push({ k: 'sfx', x: sx, y: y + 4, w: slw });
    y += 34 * u + 8 * u; const ow = Math.min(W * 0.4, 128), oh = 38, og = 10;
    menuPill(cx - ow - og / 2, y, ow, oh, AU.muted ? 'SES  KAPALI' : 'SES  AÇIK', 1, false, 0); PAUSE.btns.push({ x: cx - ow - og / 2, y: y - 4, w: ow, h: oh + 8, fn: () => AU.toggleMute() });
    menuPill(cx + og / 2, y, ow, oh, light ? 'TEMA  AÇIK' : 'TEMA  KOYU', 1, false, 0); PAUSE.btns.push({ x: cx + og / 2, y: y - 4, w: ow, h: oh + 8, fn: toggleBg });
    y += oh + 16; { const kw = Math.min(W * 0.64, 250); menuPill(cx - kw / 2, y, kw, oh, 'KIYAFET', 1, false, 0); PAUSE.btns.push({ x: cx - kw / 2, y: y - 4, w: kw, h: oh + 8, fn: wdEnter }); }
    if (DEV.on) {   // geliştirici ayarları: ayrı sayfada açılır
      y += oh + 12; const gw = Math.min(W * 0.64, 250);
      menuPill(cx - gw / 2, y, gw, oh, 'GELİŞTİRİCİ AYARLARI', 1, false, 0); ctx.save(); rr(cx - gw / 2, y, gw, oh, oh / 2); ctx.strokeStyle = 'rgba(240,194,74,0.6)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
      PAUSE.btns.push({ x: cx - gw / 2, y: y - 4, w: gw, h: oh + 8, fn: () => { PAUSE.page = 'dev'; } });
    }
    ctx.restore();
  }

  /* ---------- Döngü ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (MENU.on && PAUSE.on) { try { AU.update(dt, 0); } catch (_) {} drawPause(dt, false); requestAnimationFrame(frame); return; }
    if (MENU.on) { drawMenu(dt); try { AU.update(dt, 0); } catch (_) {} requestAnimationFrame(frame); return; }
    if (PAUSE.on) { try { AU.setMode('menu'); AU.update(dt, 0); } catch (_) {} drawPause(dt, false); requestAnimationFrame(frame); return; }
    TM.t += dt;
    const stopped = FX.stop > 0; if (stopped) FX.stop -= dt;
    const sdt = stopped ? dt * 0.04 : dt;   // vuruş duraklaması: oyun neredeyse donar

    let ix = joy.dx, iy = joy.dy;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    if (F.death >= 0) ix = iy = 0;
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    if (keys['shift']) { const mm = Math.hypot(ix, iy); if (mm > 0.45) { ix *= 0.45 / mm; iy *= 0.45 / mm; } } // Shift = yürü (masaüstü testi)

    // yumuşak ivmelenme
    const t = 1 - Math.exp(-14 * sdt), spd = SPEED * gearM('speed') * (F.guarding ? 0.75 + gearA('guard') : 1) * (1 - 0.45 * BOW.aimw);   // siperdeyken yavaş
    player.vx += (ix * spd - player.vx) * t;
    player.vy += (iy * spd - player.vy) * t;
    player.x += player.vx * sdt; player.y += player.vy * sdt;
    collideStatues(); collideChests();
    if (Math.hypot(player.vx, player.vy) > 12) player.angle = Math.atan2(player.vy, player.vx);

    updateHero(sdt);
    updateGun(sdt);
    updateFight(sdt);
    updateBow(sdt);
    updateEnemies(sdt);
    updateBolts(sdt);
    updateEvil(sdt); updateChests(sdt);
    updateFx(dt, sdt);
    let alert = 0; for (const e of E) if (e.em >= 1 && Math.hypot(e.x - player.x, e.y - player.y) < 460) alert += e.st === 'wind' || e.st === 'strike' ? 0.3 : 0.18;
    try { AU.setMode('game'); AU.setListener(player.x, player.y); AU.update(dt, clamp(alert, 0, 1)); } catch (_) {}   // müzik yoğunluğu çatışmayla yükselir; heykel sesleri / Doppler

    joy.alpha += ((joy.active ? 1 : 0) - joy.alpha) * (1 - Math.exp(-16 * dt));

    // çizim
    const bgCol = light ? '#f2f2f2' : '#0a0a0a';
    const fg = light ? '0,0,0' : '255,255,255';
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H);
    const ck = dmp(10, dt); cam.x += (player.x - W / 2 - cam.x) * ck; cam.y += (player.y - H / 2 - cam.y) * ck;   // kamera yumuşak takip
    cam.x += FX.ox; cam.y += FX.oy;   // kamera sarsıntısı
    drawWorld(fg);
    setBase();
    drawPrints(fg);
    drawTele(fg);

    drawGroundGun(fg, light);
    const sfg = light ? '105,105,105' : '150,150,150';
    const sObjs = statuesIn(cam.x - 80, cam.y - 20, cam.x + W + 80, cam.y + H + 140).map(([x, y, id, ev]) => ({ y, f: ev ? () => drawEvil(x, y, id, light) : () => drawStatue(x, y, SS, sfg, light) }));
    const cObjs = chestsIn(cam.x - 80, cam.y - 20, cam.x + W + 80, cam.y + H + 140).map(([x, y, id, lk]) => ({ y, f: () => drawChest(x, y, id, lk, light) })).concat(LOOT.map(l => ({ y: l.y, f: () => drawLoot(l) })));
    const eObjs = E.map(e => ({ y: e.y, f: () => drawEnemy(e, fg) })).concat(EP.map(p => ({ y: p.y, f: () => drawBolt(p, fg) }))), allO = sObjs.concat(eObjs, cObjs).sort((a, b) => a.y - b.y);
    allO.filter(o => o.y < player.y).forEach(o => o.f());
    drawBowAim(fg);
    ctx.globalAlpha = F.flash > 0 && Math.floor(F.time * 30) % 2 ? 0.4 : 1;   // hasar alınca yanıp söner
    drawHero(fg, light);
    ctx.globalAlpha = 1;
    drawSlash(fg);
    drawSparks(fg);
    allO.filter(o => o.y >= player.y).forEach(o => o.f());
    drawArrows(fg);
    drawSmoke(light); drawShards(light); drawDebris(light); drawWood(); drawChestPieces(light); drawChestFx(light); drawRings(); drawDmgNums(fg); drawFT(fg);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (light) {
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(0,0,0,0.7)';
      debugLines().forEach((t, i) => ctx.fillText(t, 20, 90 + i * 16));
    }

    if (F.dp > 0.01) { ctx.fillStyle = light ? `rgba(242,242,242,${0.4 * F.dp})` : `rgba(0,0,0,${0.45 * F.dp})`; ctx.fillRect(0, 0, W, H); }   // ölümde ekran kararır
    // joystick
    if (joy.alpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = joy.alpha;
      const bg = ctx.createRadialGradient(joy.bx, joy.by, joy.R * 0.2, joy.bx, joy.by, joy.R);
      bg.addColorStop(0, `rgba(${fg},0.03)`);
      bg.addColorStop(1, `rgba(${fg},0.12)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${fg},0.28)`; ctx.stroke();

      const kg = ctx.createRadialGradient(joy.kx - 6, joy.ky - 8, 2, joy.kx, joy.ky, 28);
      kg.addColorStop(0, `rgba(${fg},0.55)`);
      kg.addColorStop(1, `rgba(${fg},0.22)`);
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 27, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.stroke();
      ctx.restore();
    }
    drawHud(fg); drawBowHud(fg); drawTimer(fg, dt);
    drawAtk(fg, dt); drawBowBtn(fg, dt); drawPauseBtn(fg, dt);
    if (PAUSE.a > 0) drawPause(dt, true);
    if (MENU.blk > 0) { MENU.blk = Math.max(0, MENU.blk - dt / 0.7); ctx.fillStyle = `rgba(0,0,0,${MENU.blk})`; ctx.fillRect(0, 0, W, H); }   // karartmadan açılış
    cam.x -= FX.ox; cam.y -= FX.oy;
    requestAnimationFrame(frame);
  }

  addEventListener('scroll', () => { if (scrollX || scrollY) scrollTo(0, 0); });
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
