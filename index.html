<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oyun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: relative; margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; background: #000; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- ARAYÜZ KURALI: oyun yalnızca YATAY çalışır. Dikey düzen yok. ---------- */

  /* ---------- Dikey fiziksel ekranda dokunma eşleme (ROT) ---------- */
  ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(tp => window.addEventListener(tp, e => {
    if (!ROT) return;
    const gx = e.clientY, gy = VPW - e.clientX;
    try { Object.defineProperty(e, 'clientX', { value: gx, configurable: true }); Object.defineProperty(e, 'clientY', { value: gy, configurable: true }); } catch (_) {}
  }, true));

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  /* YARI SAYDAM YAZI YOK: yazı rengi alfalıysa zemin rengiyle karıştırılıp opak renge çevrilir (globalAlpha geçiş animasyonlarına dokunulmaz) */
  { const _ft = ctx.fillText.bind(ctx), RX = /^rgba\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)$/;
    ctx.fillText = function (t, x, y, mw) {
      const fs = ctx.fillStyle, m = typeof fs === 'string' && RX.exec(fs);
      if (m && +m[4] < 1) {
        const a = Math.max(0, Math.min(1, +m[4])), b = (typeof light !== 'undefined' && light) ? 242 : 8, k = c => Math.round(b + (+c - b) * a);
        ctx.fillStyle = `rgb(${k(m[1])},${k(m[2])},${k(m[3])})`; mw === undefined ? _ft(t, x, y) : _ft(t, x, y, mw); ctx.fillStyle = fs; return;
      }
      mw === undefined ? _ft(t, x, y) : _ft(t, x, y, mw);
    };
  }
  let W = 0, H = 0, DPR = 1;
  let VPW = 0, VPH = 0, ROT = false, PORTRAIT = false;   // PORTRAIT: dokunmatik cihaz dikey tutuluyor → oyun çizilmez, 'telefonu yatay çevir' animasyonu gösterilir
     // PW/PH: fiziksel görünüm alanı · ROT: fiziksel ekran dikeyse oyun 90° döndürülmüş yatay çizilir
  let SAS = 0;   // yatay güvenli alan payı (çentik / dinamik ada / yuvarlak köşe): sayfa içerikleri ve sağ düğmeler bu kadar içeriden başlar
  let SEED = 0;   // harita tohumu: her yeni oyunda rastgele; hashN ile üretilen her şey (heykel, sandık, kamp, harabe) buna bağlıdır
  const cam = { x: 0, y: 0 };
  let ZT = 1, ZOOM = 1;   // dünya yakınlaştırması: ZT hedef (yatayda <1 = uzak kamera), ZOOM o an kullanılan (ana menüde 1)
  const camCX = () => W / ZT / 2, camCY = () => H / ZT / 2;   // kameranın oyuncuyu ortalayan yarı görüş alanı (dünya birimi)
  const atk = { id: null, down: false, kb: false, x: 0, y: 0, r: 42, vis: 0, rip: 0, was: false, spin: 0 };   // saldırı butonu (vis: 0 = yok, 1 = tam görünür)
  const setBase = () => ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, -cam.x * DPR * ZOOM, -cam.y * DPR * ZOOM);   // dünya -> ekran

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    VPW = window.innerWidth; VPH = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı (home indicator) hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (VPH > VPW && full > VPH) VPH = full;
    }
    // DİKEY FİZİKSEL EKRAN: yatay kilit mümkün değilse (iOS, tarayıcı sekmesi) oyun 90° döndürülüp yatay çizilir;
    // telefon dikey tutulsa da oyun yatay kalır, dikey düzen yoktur.
    PORTRAIT = VPH > VPW && matchMedia('(pointer: coarse)').matches; ROT = false;   // artık oyun yan döndürülüp çizilmez: dikeyde yönlendirme ekranı çıkar
    W = VPW; H = VPH;
    const de = document.documentElement.style, bs = document.body.style;
    de.height = VPH + 'px'; de.overflow = 'hidden'; bs.width = VPW + 'px'; bs.height = VPH + 'px'; bs.overflow = 'hidden';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.style.transformOrigin = '0 0';
    cv.style.transform = ROT ? 'translateX(' + VPW + 'px) rotate(90deg)' : 'none';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // kamera uzaklığı yatayda da dikeyle aynı: 1:1 (eskiden yatayda clamp(H / 460, 0.7, 1) ile uzaklaştırılıyordu)
    ZT = 1; ZOOM = ZT;
    // HUD: sol panel ile sağ düğme aynı kenar boşluğunda (çentik/yuvarlak köşe güvenli alanı dahil), yatayda üst boşluk küçük
    const cs = getComputedStyle(probe), sal = parseFloat(ROT ? cs.paddingTop : cs.paddingLeft) || 0, sar = parseFloat(ROT ? cs.paddingBottom : cs.paddingRight) || 0;
    SAS = Math.max(sal, sar); HUD_M = Math.max(12, sal, sar); HUD_Y = 38; HUD_S = clamp(H / 360, 1, 1.25);   // yatayda HUD biraz büyür (eskisinden ~%17 küçük: profil paneli, duraklatma, çanta, saat)
    cam.x = player.x - camCX(); cam.y = player.y - camCY();
  }

  /* ---------- Hata ayıklama bilgisi (açık zemin modunda görünür) ---------- */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function debugLines() {
    const sab = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    return [
      'tuval ' + W + 'x' + H,
      'inner ' + innerWidth + 'x' + innerHeight,
      'screen ' + screen.width + 'x' + screen.height,
      '100vh ' + probe.getBoundingClientRect().height,
      'alt guvenli alan ' + sab,
      'ust guvenli alan ' + (parseFloat(getComputedStyle(probe).paddingTop) || 0),
      'vv ' + (window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '-'),
      'scrollY ' + scrollY,
      'standalone ' + navigator.standalone
    ];
  }

  /* ---------- Oyuncu ---------- */
  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, angle: -Math.PI / 2 };
  const SPEED = 230;

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  const DBG = /debug/.test(location.hash);   // hata ayıklama yazıları artık yalnızca #debug ile görünür (açık zemin gündüzün normal temasıdır)
  function toggleBg() { /* artık kapalı: zemin (açık/koyu) oyun saatine göre kendiliğinden değişir */ }
  function setLight(v) {
    light = !!v;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      toggleBg(); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  function joyStart(e) {
    AU.unlock();
    if (PORTRAIT) return;   // dikeyken oyuna dokunuş yok
    if (DEATH.on) { deathTap(e.clientX, e.clientY); return; }   // ölüm ekranı: yalnızca düğmeler
    if (MENU.on && PAUSE.on) { pauseDown(e); return; }   // ana menüden açılan kıyafet sayfası
    if (MENU.on) { menuTap(e.clientX, e.clientY); return; }   // ana menü açıkken dokunuşlar yalnızca menüye gider
    if (PAUSE.on) { pauseDown(e); return; }   // duraklatılmışken dokunuşlar yalnızca menüye gider
    { const dpz = Math.hypot(e.clientX - AU.btn.x, e.clientY - AU.btn.y), dbg = bagHit(e.clientX, e.clientY), rh = AU.btn.r * HUD_S + 14; if (dbg < rh && dbg < dpz) { openBag(); return; } if (dpz < rh) { togglePause(); return; } }   // çanta / duraklatma düğmesi (yakın olan)
    if (SWB.v > 0.6 && Math.hypot(e.clientX - SWB.x, e.clientY - SWB.y) < SWB.r + 12) { swapTool(); return; }   // alet değiştir
    if (atk.id === null && atkActive() && Math.hypot(e.clientX - atk.x, e.clientY - atk.y) < atk.r + 14) {   // buton joystick'ten önceliklidir
      atk.id = e.pointerId; atk.down = true; pressAtk();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    if (BOW.id === null && BOW.has && BOW.vv > 0.6 && Math.hypot(e.clientX - BOW.bx, e.clientY - BOW.by) < BOW.r + 14) {   // yay düğmesi
      BOW.id = e.pointerId; BOW.down = true;
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    { const pk = prBtnAt(e.clientX, e.clientY); if (pk) { if (pk === 'bomb') bombThrow(); else { BEAM.id = e.pointerId; BEAM.down = true; try { e.target.setPointerCapture(e.pointerId); } catch (_) {} } return; } }   // mor prizma düğmeleri
    if (campBtnAt(e.clientX, e.clientY)) { campAction(); return; }   // kamp: craft tezgahı
    { const dk = devHpAt(e.clientX, e.clientY); if (dk) { devHpAct(dk); return; } }   // geliştirici can düğmeleri
    { const hk = healBtnAt(e.clientX, e.clientY); if (hk) { healStart(hk); return; } }   // şifa düğmeleri
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY;
    joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { dx *= joy.R / d; dy *= joy.R / d; }   // taban sabit kalır; topuz yalnızca halkanın içinde hareket eder
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
    joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId === BEAM.id) { BEAM.id = null; BEAM.down = false; return; }
    if (e.pointerId === BOW.id) { BOW.id = null; BOW.down = false; return; }
    if (e.pointerId === atk.id) { atk.id = null; atk.down = false; relAtk(); return; }
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0;
    joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => { if (MENU.on) { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'j') && MENU.t > 2.4 && !PAUSE.on) menuStart(!!SAVED); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } if (e.key === 'Escape' && PAUSE.on && PAUSE.page !== 'main') { if (PAUSE.page === 'guide') rehberBack(); else if (PAUSE.page === 'craft') craftBack(); else if (PAUSE.page === 'inv') invBack(); else if (PAUSE.page === 'smelt') smeltBack(); else if (PAUSE.page === 'skills') skillsBack(); else PAUSE.page = 'main'; return; } if ((e.key.toLowerCase() === 'p' || e.key === 'Escape') && !e.repeat) { togglePause(); return; } if (PAUSE.on) { if (e.key === 'Enter' && !e.repeat) resumeGame(); if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); return; } keys[e.key.toLowerCase()] = true; if (!e.repeat) { const hk = e.key.toLowerCase(); if (hk === 'b') healStart('band'); else if (hk === 'v') healStart('medk'); else if (hk === 't') torchToggle(); else if (hk === 'i' && !PAUSE.on) openBag(); } if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if ((e.key === 'j' || e.key === ' ') && atk.kb) { atk.kb = false; relAtk(); } });
  addEventListener('keydown', e => { if (!MENU.on && !PAUSE.on && (e.key === 'j' || e.key === ' ') && !e.repeat && !atk.kb) { atk.kb = true; pressAtk(); } });
  addEventListener('keydown', e => { if (MENU.on || PAUSE.on || e.repeat) return; const k = e.key.toLowerCase(); if (k === 'k') BOW.kb = true; else if (k === 'b') { if (!BOW.has) bowGive(); else BOW.ammo = Math.min(BOW_MAX, BOW.ammo + 6); } });   // K = yay (masaüstü) · B = test: yay ver / +6 ok
  addEventListener('keyup', e => { if (e.key.toLowerCase() === 'k') BOW.kb = false; });
  addEventListener('keydown', e => { if (MENU.on || PAUSE.on || e.repeat) return; const k = e.key.toLowerCase(); if (k === 'x') bombThrow(); else if (k === 'c') BEAM.kb = true; });
  addEventListener('keydown', e => { if (MENU.on || PAUSE.on || e.repeat) return; if (e.key.toLowerCase() === 'q') swapTool(); });   // Q = kılıç ↔ balta   // X = prizma bombası · C = prizma ışını (basılı tut)
  addEventListener('keyup', e => { if (e.key.toLowerCase() === 'c') BEAM.kb = false; });

  /* ---------- Karakter: animasyonlu, sade, karşıdan görünüm ---------- */
  const HS = 1.6;                 // karakterin görsel ölçeği
  const TIRE_RISE = 0.10;         // tam hızda koşarken saniyede artan yorgunluk (1 = bitkin)
  const REC_IDLE = 0.07, REC_WALK = 0.05; // dururken / yürürken toparlanma hızı
  const COUGH_AT = 0.45;          // bu yorgunluğun üstünde dururken ara sıra öksürür
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap = a => { while (a > Math.PI) a -= 6.2832; while (a < -Math.PI) a += 6.2832; return a; };
  const dmp = (k, dt) => 1 - Math.exp(-k * dt), rnd = (a, b) => a + Math.random() * (b - a);
  const PI = Math.PI, TAU = 6.2832;
  // GÜN IŞIĞI: 0 = tam gece, 1 = tam gündüz (ses ve atmosfer buna bağlı)
  const dayKof = f => { const h = f * 24; return h >= 6 && h < 18 ? 1 : 0; };   // ikili: 06:00–18:00 tam gündüz, diğer saatler tam gece (geçişler animasyonla gösterilir)

  /* ---------- SES: tamamen sentezlenir (ses dosyası yok) · müzik, efektler, Doppler'lı heykel sesleri, fısıltılar ---------- */
  const AU = (() => {
    let ac = null, master, sfxBus, musBus, padBus, padLP, melBus, revIn, noiseBuf, muted = false, acc = 0;
    let gameGate, menuGate, menuBus, menuPad, menuMel, menuRev, deathGate, deathBus, deathRev, mode = 'menu';   // müzik modu: 'menu' (ana menü + duraklatma) · 'game' · 'none'
    const LS = { x: 0, y: 0 }, btn = { x: 0, y: 0, r: 20, mt: 1, pop: 0, ring: 0 }, voices = new Map(), bad = new Set();
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const C_SND = 1500;            // oyun içi 'ses hızı' (px/sn): Doppler kayması net duyulsun diye düşük tutuldu
    let ambBus = null, windF, windG, crkG, musTL, tod = 1, hr = 8, lastDay = null; const ambT = { bird: 1.5, owl: 7, wolf: 25 };   // ortam sesleri · tod: gün ışığı (0 gece – 1 gündüz) · hr: oyun saati
    const MV = 0.4, SVL = 0.85;  // müzik / efekt seviyesi
    const VOL = { mus: 1, sfx: 1 }; let musRev = null;   // oyuncunun duraklatma menüsünden ayarladığı çarpanlar (0–1)
    try { const j = JSON.parse(localStorage.getItem('hlk_vol') || 'null'); if (j) for (const k of ['mus', 'sfx']) { const v = parseFloat(j[k]); if (isFinite(v)) VOL[k] = Math.min(1, Math.max(0, v)); } } catch (_) {}

    /* ----- temel yapı taşları ----- */
    function tone(d, type, f0, f1, t, dur, vol, o) {
      o = o || {}; const os = ac.createOscillator(), g = ac.createGain(), att = Math.min(o.att || 0.005, dur * 0.9);
      os.type = type; os.frequency.setValueAtTime(f0, t); if (f1 !== f0) os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.1); }
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); f.connect(g); } else os.connect(g);
      g.connect(d); os.start(t); os.stop(t + dur + 0.05);
    }
    function nz(d, t, dur, vol, ft, f0, f1, q, att) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); att = Math.min(att || 0.004, dur * 0.9);
      s.buffer = noiseBuf; s.loop = true; f.type = ft; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
    // konumlu çıkış: mesafeye göre kısılır / matlaşır, soldan sağdan gelir
    function bus(x, y, rev) {
      let pan = 0, g = 1, cut = 16000;
      if (x !== undefined) { const dx = x - LS.x, dy = y - LS.y, dd = Math.hypot(dx, dy); if (dd > 950) return null; g = 1 / (1 + (dd / 230) * (dd / 230)); pan = clamp(dx / 330, -1, 1) * 0.85; cut = Math.min(16000, 700 + 15000 / Math.pow(1 + dd / 110, 1.5)); }
      const gn = ac.createGain(), lp = ac.createBiquadFilter(); gn.gain.value = g; lp.type = 'lowpass'; lp.frequency.value = cut; gn.connect(lp);
      let tail = lp; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; lp.connect(p); tail = p; }
      tail.connect(sfxBus); if (rev > 0) { const r = ac.createGain(); r.gain.value = rev * VOL.sfx; tail.connect(r); r.connect(revIn); }
      return gn;
    }

    /* ----- efektler ----- */
    const SFX = {
      dawnChime(d, t) {   // gün doğumu: havadar, yükselen çan tınıları + ince parıltı
        [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => { tone(d, 'sine', f, f, t + i * 0.28, 2.4, 0.07, { att: 0.04 }); tone(d, 'sine', f * 2.01, f * 2.01, t + i * 0.28, 1.4, 0.02, { att: 0.04 }); });
        nz(d, t, 2.6, 0.05, 'highpass', 4000, 9000, 0.7, 1.2);
      },

  /* --- sırtta taşıma: yay çapraz asılı, yanında sadece oklu bir sadak --- */

  /* --- güncelleme: durum makinesi (idle → draw → rel) --- */
  function updateBow(dt) {
    const B = BOW;
    B.vt += dt; B.vib = Math.max(0, B.vib - dt * 3.2); B.gain = Math.max(0, B.gain - dt * 2.5); B.warn = Math.max(0, B.warn - dt * 1.5); B.dry = Math.max(0, B.dry - dt * 3); B.rip = Math.max(0, B.rip - dt * 2.4); B.ring = Math.max(0, B.ring - dt * 2);

    const dead = F.death >= 0, held = B.down || B.kb, press = held && !dead;
    if (!held) B.latch = false;

    B.recov = Math.max(0, B.recov - dt);

        else { B.hold += dt; B.perf = Math.max(0, B.perf - dt); }

        const t = bowTarget(), A = t ? Math.atan2(t.y - player.y, t.x - player.x) : hero.face; B.tgt = t;
