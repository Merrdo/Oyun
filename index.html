<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oyun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: relative; margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; background: #000; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (H > W && full > H) H = full;
    }
    const de = document.documentElement.style, bs = document.body.style;
    de.height = H + 'px'; bs.width = W + 'px'; bs.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- Dünya / kamera ---------- */
  const WORLD = { w: 1800, h: 1800 };
  const cam = { x: 0, y: 0 };
  const SPEED = 190;
  const PS = 2;     // oyuncu ölçeği (boy ≈ 34px)
  const SS = 1.1;   // heykel ölçeği
  const player = { x: 900, y: 1000, vx: 0, vy: 0, fx: 0, fy: 1, move: 0, phase: 0, t: 0, attack: 0 };
  // heykeller: [x, y] (kaidenin tabanı)
  const statues = [[640, 560], [1160, 600], [900, 760], [420, 1180], [1380, 1240], [900, 1500], [260, 380], [1560, 420]];

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const TAU = 6.2832, PI = Math.PI;

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  function toggleBg() {
    light = !light;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) { toggleBg(); lastTap.t = 0; }
    else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };
  function joyStart(e) {
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY; joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { const k = (d - joy.R) / d; joy.bx += dx * k; joy.by += dy * k; dx = e.clientX - joy.bx; dy = e.clientY - joy.by; }
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy; joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0; joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.code === 'Space' && player.attack <= 0) player.attack = 0.28; });
  addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  /* =====================================================================
     HEYKEL: Pelerinli, kukuletalı gezgin savaşçı anıtı (haritada dekor)
     - Karşıdan görünüm, tek renkli siluet tarzı (fg), detaylar arka plan renginde
     - Tek vurgu rengi: parlayan kehribar gözler + kılıç kabzası taşı
     - Origin (0,0) = ayakların altı; yukarısı eksi Y. Boy ≈ 64 birim.
     - Şu an tamamen STATİK: animasyon için her parça ayrı fonksiyon,
       istediğin parçaya ofset/açı parametresi ekleyebilirsin.
     ===================================================================== */
  const ACCENT = '#ffb02e';

  // yuvarlatılmış dikdörtgen yolu (eski tarayıcılarda roundRect yok)
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  const poly = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };

  function drawStatue(sx, sy, sc, fg, light) {
    const ACCENT = '#7a5416';   // taş heykelde göz/taş sönük
    const col = `rgb(${fg})`, bg = light ? '#f2f2f2' : '#000';
    const VOID = '#000';                       // kukuletanın içi hep karanlık
    ctx.save();
    ctx.translate(sx, sy); ctx.scale(sc, sc);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // kaide
    ctx.fillStyle = `rgba(${fg},0.5)`; rr(-17, 0, 34, 7, 1.5); ctx.fill();
    ctx.fillStyle = `rgba(${fg},0.85)`; rr(-19, -1.4, 38, 2.6, 1.2); ctx.fill();

    // ---- pelerin (arka katman, yırtık etek) ----
    ctx.fillStyle = `rgba(${fg},0.6)`;
    ctx.beginPath();
    ctx.moveTo(-9, -41); ctx.lineTo(9, -41);
    ctx.bezierCurveTo(14, -32, 17, -18, 17.5, -6);
    ctx.lineTo(11.5, -10); ctx.lineTo(8.5, -4.5); ctx.lineTo(4.5, -9); ctx.lineTo(1, -4);
    ctx.lineTo(-2.5, -9.5); ctx.lineTo(-6.5, -5); ctx.lineTo(-10, -10); ctx.lineTo(-17.5, -6);
    ctx.bezierCurveTo(-17, -18, -14, -32, -9, -41);
    ctx.closePath(); ctx.fill();

    // ---- bacaklar + botlar ----
    ctx.strokeStyle = col; ctx.lineWidth = 4.4;
    [-3.6, 3.6].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -17); ctx.lineTo(x * 1.05, -5); ctx.stroke(); });
    ctx.fillStyle = col;
    rr(-7.6, -5.4, 7.2, 5.4, 1.8); ctx.fill();
    rr(0.4, -5.4, 7.2, 5.4, 1.8); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.7;           // bot kıvrımı
    [-7.2, 0.8].forEach(x => { ctx.beginPath(); ctx.moveTo(x + 0.6, -3.2); ctx.lineTo(x + 6, -3.2); ctx.stroke(); });

    // ---- gövde: tunik + etek ----
    ctx.fillStyle = col;
    poly([[-8, -20], [8, -20], [10.2, -11.5], [-10.2, -11.5]]); ctx.fill();
    rr(-8.6, -41, 17.2, 23, 4); ctx.fill();
    // etek ortası dikişi
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(0, -19.5); ctx.lineTo(0, -12.5); ctx.stroke();
    // göğüs askısı
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-7, -38.5); ctx.lineTo(6.5, -23); ctx.stroke();
    // kemer + tokası
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-8.6, -21); ctx.lineTo(8.6, -21); ctx.stroke();
    ctx.fillStyle = col; rr(-1.8, -22.8, 3.6, 3.6, 0.8); ctx.fill();
    ctx.fillStyle = bg; ctx.fillRect(-0.7, -21.7, 1.4, 1.4);

    // ---- sağ kol (kılıç kolu) ----
    ctx.strokeStyle = col; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(9.5, -37); ctx.lineTo(13.5, -29); ctx.lineTo(13.2, -23); ctx.stroke();

    // ---- kılıç (hafif dışa eğik) ----
    ctx.save(); ctx.translate(13.2, -24); ctx.rotate(0.1);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 4, 1.5, 0, 6.2832); ctx.fill();               // kabza ucu
    ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.arc(0, 4, 0.7, 0, 6.2832); ctx.fill(); // taş
    ctx.fillStyle = col; ctx.fillRect(-1, -3.5, 2, 6.5);                          // sap
    rr(-5, -5, 10, 2.2, 1); ctx.fill();                                         // siper
    poly([[-2.3, -5], [2.3, -5], [1.9, -34], [0, -39], [-1.9, -34]]); ctx.fill(); // kama
    ctx.strokeStyle = bg; ctx.lineWidth = 0.7;                                  // kan oluğu
    ctx.beginPath(); ctx.moveTo(0, -7.5); ctx.lineTo(0, -31); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(13.2, -23, 2.4, 0, 6.2832); ctx.fill(); // el

    // ---- omuz zırhları ----
    [-10.2, 10.2].forEach(x => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, -38, 4.8, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x, -38, 4.8, 0, 6.2832); ctx.stroke();
      ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(x, -38, 2.6, 3.6, 5.8); ctx.stroke();
    });

    // ---- kalkan (sol kol önünde) ----
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-14.5, -26, 8.6, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(-14.5, -26, 8.6, 0, 6.2832); ctx.stroke();
    ctx.lineWidth = 0.7; ctx.beginPath(); ctx.arc(-14.5, -26, 6, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(-14.5, -26, 2.1, 0, 6.2832); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-14.5, -26, 0.8, 0, 6.2832); ctx.fill();

    // ---- atkı (boyun) + sarkan ucu ----
    ctx.fillStyle = col;
    poly([[-6, -39], [-2, -38.5], [-5.5, -27], [-9, -28.5]]); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-8.4, -31); ctx.lineTo(-4.6, -29.8); ctx.stroke();
    rr(-7.4, -42.4, 14.8, 4.6, 2.2); ctx.fill();
    ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-6, -40.1); ctx.lineTo(6, -40.1); ctx.stroke();

    // ---- kukuleta ----
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-8.8, -40.5);
    ctx.bezierCurveTo(-11.8, -48, -9, -57, -1.5, -60.5);
    ctx.quadraticCurveTo(2.5, -65.5, 6.5, -58.5);       // sivri uç, hafif eğik
    ctx.bezierCurveTo(10.5, -54, 11.5, -46, 8.8, -40.5);
    ctx.quadraticCurveTo(0, -36.5, -8.8, -40.5);
    ctx.closePath(); ctx.fill();
    // kukuleta kıvrım çizgisi
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-6.8, -53.5); ctx.quadraticCurveTo(-2, -60, 2.5, -61.5); ctx.stroke();

    // yüz boşluğu
    ctx.fillStyle = VOID;
    ctx.beginPath(); ctx.ellipse(0, -47.2, 5.4, 6.4, 0, 0, 6.2832); ctx.fill();

    // parlayan gözler
    ctx.save();
    ctx.fillStyle = ACCENT;
    [-2.2, 2.2].forEach(x => { ctx.beginPath(); ctx.ellipse(x, -47.6, 1.15, 0.85, 0, 0, 6.2832); ctx.fill(); });
    ctx.restore();

    ctx.restore();
  }

  /* =====================================================================
     OYUNCU: Minik kukuletalı "uyanık" – heykellerin yaşayan hali
     - Çan biçimli pelerin + sivri kukuleta ucu, yırtık etek, 2 minik ayak
     - Karanlık yüz içinde parlayan kehribar gözler, göğüste kehribar "rün" işareti
     - Boy ≈ 18 birim (PS ile büyür), origin (0,0) = ayakların altı
     - Yön: player.fx/fy (bakış). Kukuleta ucu ve etek hareketin tersine savrulur
     - Animasyon girdileri: player.move (0 dur → 1 yürü), player.phase (adım), player.t (zaman)
     ===================================================================== */
  function drawPlayer(fg, light) {
    // Kayıp Ruh: piksel kenarlı, kukuletalı yakın dövüşçü.
    // Hareket, pelerin salınımı, göz kırpma ve saldırı animasyonu Canvas ile çizilir.
    const P = player, mv = P.move, ph = P.phase;
    const bob = mv ? Math.abs(Math.sin(ph)) * 1.3 : Math.sin(P.t * 2.2) * 0.35;
    const sway = Math.round(Math.sin(ph * 0.8) * 1.5 * mv);
    const gold = '#ffb347', purple = '#4b3b6b', dark = '#171225';
    const cloth = light ? '#25202d' : '#292039';
    const pixel = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); };
    ctx.save(); ctx.translate(Math.round(P.x), Math.round(P.y)); ctx.scale(PS, PS);
    // gölge ve minik adım animasyonu
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(-6,-1,12,2);
    const step = mv ? Math.round(Math.sin(ph) * 2) : 0;
    // ayaklar
    pixel(-4,-4+Math.max(0,step),3,3,'#09080d'); pixel(-4,-4+Math.max(0,step),2,2,'#6b5360');
    pixel(2,-4+Math.max(0,-step),3,3,'#09080d'); pixel(2,-4+Math.max(0,-step),2,2,'#6b5360');
    // arkadaki yırtık pelerin; adımda geriye doğru titreşir
    pixel(-5+sway,-14-bob,10,8,'#100d18');
    pixel(-6+sway,-12-bob,12,7,cloth);
    pixel(-7+sway,-8-bob,4,5,purple); pixel(-2+sway,-7-bob,3,4,'#120e1b');
    pixel(3+sway,-8-bob,4,5,'#171020');
    // gövde ve kemer
    pixel(-4,-13-bob,8,8,'#17121f'); pixel(-3,-13-bob,6,7,cloth);
    pixel(-4,-7-bob,8,2,'#100d15'); pixel(-1,-7-bob,3,2,'#b77b32');
    // omuz zırhları
    pixel(-6,-13-bob,3,3,'#51405c'); pixel(3,-13-bob,3,3,'#51405c');
    pixel(-5,-12-bob,2,1,'#8d718f'); pixel(4,-12-bob,1,1,'#8d718f');
    // kukuleta ve sivri uç
    pixel(-4,-19-bob,8,2,'#0d0a13'); pixel(-5,-18-bob,10,5,'#241a34');
    pixel(-4,-20-bob,6,3,'#342347'); pixel(-2,-22-bob,4,3,'#342347');
    pixel(-1,-23-bob,3,2,'#4b2b60'); pixel(-4,-17-bob,8,4,'#120e1b');
    // yüz boşluğu ve kehribar gözler
    pixel(-3,-17-bob,6,4,'#050408');
    const blink = (P.t % 4.1) < 0.12;
    if (!blink) { pixel(-2,-16-bob,2,1,gold); pixel(2,-16-bob,2,1,gold); }
    else pixel(-1,-16-bob,3,1,gold);
    // göğüs rünü nefes alır gibi parlar
    const runeGlow = 0.65 + 0.35*Math.sin(P.t*3.2);
    ctx.globalAlpha = runeGlow; pixel(-1,-10-bob,3,3,gold); pixel(0,-11-bob,1,1,'#fff0b2'); ctx.globalAlpha=1;
    // kısa, koyu kılıç; yön vektörüne göre döner
    const attacking = P.attack > 0;
    ctx.save();
    const angle = attacking ? (-1.15 + (0.28-P.attack)/0.28*2.1) : Math.atan2(P.fy,P.fx) + Math.PI/2;
    ctx.translate(4,-10-bob); ctx.rotate(angle);
    pixel(-1,-8,3,10,'#09070e'); pixel(0,-9,1,10,'#b8c1cf'); pixel(0,-8,1,7,'#eef0f5');
    pixel(-2,0,5,2,'#d58a3a'); pixel(-1,2,3,2,'#382238');
    if (attacking) {
      ctx.globalAlpha = Math.min(1,P.attack/0.12); ctx.strokeStyle=gold; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.arc(0,0,12,-1.2,0.8); ctx.stroke();
      ctx.globalAlpha=0.5; ctx.strokeStyle='#a855f7'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,15,-1.1,0.5); ctx.stroke();
    }
    ctx.restore();
    // özel güç aurası: hareketsizken hafifçe nabız atar
    ctx.globalAlpha=0.18+0.12*(Math.sin(P.t*2)+1)/2; ctx.strokeStyle='#a855f7'; ctx.lineWidth=1;
    ctx.strokeRect(-8,-24-bob,16,23); ctx.globalAlpha=1;
    ctx.restore();
  }

  /* ---------- Güncelleme ---------- */
  function update(dt) {
    const P = player;
    P.attack = Math.max(0, P.attack - dt);
    let ix = joy.dx, iy = joy.dy;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }
    const k = 1 - Math.exp(-14 * dt);
    P.vx += (ix * SPEED - P.vx) * k; P.vy += (iy * SPEED - P.vy) * k;
    P.x += P.vx * dt; P.y += P.vy * dt;

    // sınırlar + heykel kaideleri (elips çarpışma)
    P.x = clamp(P.x, 12, WORLD.w - 12); P.y = clamp(P.y, 22, WORLD.h - 3);
    statues.forEach(([sx, sy]) => {
      const rx = 19 * SS + 7, ry = 6 * SS + 4, nx = (P.x - sx) / rx, ny = (P.y - (sy + 3)) / ry, d = Math.hypot(nx, ny);
      if (d < 1) { const q = d || 0.001; P.x = sx + nx / q * rx; P.y = sy + 3 + (d ? ny / q : 1) * ry; }
    });

    const sp = Math.hypot(P.vx, P.vy);
    P.t += dt;
    P.move += (sstep(10, 70, sp) - P.move) * (1 - Math.exp(-12 * dt));
    P.phase += dt * TAU * 1.9 * clamp(sp / SPEED, 0, 1);
    if (sp > 20) {   // bakış yönü (yumuşak)
      const kk = 1 - Math.exp(-14 * dt);
      P.fx += (P.vx / sp - P.fx) * kk; P.fy += (P.vy / sp - P.fy) * kk;
    }

    // kamera
    cam.x = WORLD.w <= W ? (WORLD.w - W) / 2 : clamp(P.x - W / 2, 0, WORLD.w - W);
    cam.y = WORLD.h <= H ? (WORLD.h - H) / 2 : clamp(P.y - H * 0.5, 0, WORLD.h - H);
    joy.alpha += ((joy.active ? 1 : 0) - joy.alpha) * (1 - Math.exp(-16 * dt));
  }

  /* ---------- Çizim ---------- */
  const hash = (i, j) => { const x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
  function drawFloor(fg) {
    const T = 72, i0 = Math.floor(cam.x / T), i1 = Math.ceil((cam.x + W) / T), j0 = Math.floor(cam.y / T), j1 = Math.ceil((cam.y + H) / T);
    for (let i = i0; i < i1; i++) for (let j = j0; j < j1; j++) {
      if (i < 0 || j < 0 || i * T >= WORLD.w || j * T >= WORLD.h) continue;
      const h = hash(i, j);
      ctx.fillStyle = `rgba(${fg},${0.012 + h * 0.03})`; ctx.fillRect(i * T, j * T, T, T);
      ctx.fillStyle = `rgba(${fg},0.12)`;
      if (h > 0.55) ctx.fillRect(i * T + h * 50 + 6, j * T + hash(j, i) * 50 + 6, 2, 2);
    }
    ctx.strokeStyle = `rgba(${fg},0.07)`; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = i0; i <= i1; i++) { ctx.moveTo(i * T, j0 * T); ctx.lineTo(i * T, j1 * T); }
    for (let j = j0; j <= j1; j++) { ctx.moveTo(i0 * T, j * T); ctx.lineTo(i1 * T, j * T); }
    ctx.stroke();
    ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.lineWidth = 3; ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
  }

  function draw() {
    const fg = light ? '0,0,0' : '255,255,255', sfg = light ? '105,105,105' : '150,150,150';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = light ? '#f2f2f2' : '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    drawFloor(fg);
    // y'ye göre sırala: önde duran sonra çizilir
    const items = statues.map(([x, y]) => ({ y, f: () => drawStatue(x, y, SS, sfg, light) }));
    items.push({ y: player.y, f: () => drawPlayer(fg, light) });
    items.sort((a, b) => a.y - b.y).forEach(it => it.f());
    ctx.restore();

    if (joy.alpha > 0.01) {
      ctx.save(); ctx.globalAlpha = joy.alpha;
      const g = ctx.createRadialGradient(joy.bx, joy.by, joy.R * 0.2, joy.bx, joy.by, joy.R);
      g.addColorStop(0, `rgba(${fg},0.03)`); g.addColorStop(1, `rgba(${fg},0.12)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, TAU); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${fg},0.28)`; ctx.stroke();
      const kg = ctx.createRadialGradient(joy.kx - 6, joy.ky - 8, 2, joy.kx, joy.ky, 28);
      kg.addColorStop(0, `rgba(${fg},0.55)`); kg.addColorStop(1, `rgba(${fg},0.22)`);
      ctx.fillStyle = kg; ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 27, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.stroke();
      ctx.restore();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('scroll', () => { if (scrollX || scrollY) scrollTo(0, 0); });
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
