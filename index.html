<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: relative; margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; background: #000; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0 };
  const atk = { id: null, down: false, kb: false, x: 0, y: 0, r: 40 };   // saldırı butonu
  const setBase = () => ctx.setTransform(DPR, 0, 0, DPR, -cam.x * DPR, -cam.y * DPR);   // dünya -> ekran

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı (home indicator) hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (H > W && full > H) H = full;
    }
    const de = document.documentElement.style, bs = document.body.style;
    de.height = H + 'px'; bs.width = W + 'px'; bs.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cam.x = player.x - W / 2; cam.y = player.y - H / 2;
  }

  /* ---------- Hata ayıklama bilgisi (açık zemin modunda görünür) ---------- */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function debugLines() {
    const sab = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    return [
      'tuval ' + W + 'x' + H,
      'inner ' + innerWidth + 'x' + innerHeight,
      'screen ' + screen.width + 'x' + screen.height,
      '100vh ' + probe.getBoundingClientRect().height,
      'alt guvenli alan ' + sab,
      'ust guvenli alan ' + (parseFloat(getComputedStyle(probe).paddingTop) || 0),
      'vv ' + (window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '-'),
      'scrollY ' + scrollY,
      'standalone ' + navigator.standalone
    ];
  }

  /* ---------- Oyuncu ---------- */
  const player = { x: 0, y: 0, vx: 0, vy: 0, r: 16, angle: -Math.PI / 2 };
  const SPEED = 230;

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  function toggleBg() {
    light = !light;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      toggleBg(); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  function joyStart(e) {
    AU.unlock();
    if (Math.hypot(e.clientX - AU.btn.x, e.clientY - AU.btn.y) < AU.btn.r + 10) { AU.toggleMute(); return; }   // ses aç/kapa düğmesi
    if (atk.id === null && Math.hypot(e.clientX - atk.x, e.clientY - atk.y) < atk.r + 14) {   // buton joystick'ten önceliklidir
      atk.id = e.pointerId; atk.down = true; pressAtk();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY;
    joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { // taban parmağı takip eder
      const k = (d - joy.R) / d;
      joy.bx += dx * k; joy.by += dy * k;
      dx = e.clientX - joy.bx; dy = e.clientY - joy.by;
    }
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
    joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId === atk.id) { atk.id = null; atk.down = false; relAtk(); return; }
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0;
    joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'm' && !e.repeat) AU.toggleMute(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if ((e.key === 'j' || e.key === ' ') && atk.kb) { atk.kb = false; relAtk(); } });
  addEventListener('keydown', e => { if ((e.key === 'j' || e.key === ' ') && !e.repeat && !atk.kb) { atk.kb = true; pressAtk(); } });

  /* ---------- Karakter: animasyonlu, sade, karşıdan görünüm ---------- */
  const HS = 1.6;                 // karakterin görsel ölçeği
  const TIRE_RISE = 0.10;         // tam hızda koşarken saniyede artan yorgunluk (1 = bitkin)
  const REC_IDLE = 0.07, REC_WALK = 0.05; // dururken / yürürken toparlanma hızı
  const COUGH_AT = 0.45;          // bu yorgunluğun üstünde dururken ara sıra öksürür
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap = a => { while (a > Math.PI) a -= 6.2832; while (a < -Math.PI) a += 6.2832; return a; };
  const dmp = (k, dt) => 1 - Math.exp(-k * dt), rnd = (a, b) => a + Math.random() * (b - a);
  const PI = Math.PI, TAU = 6.2832;

  /* ---------- SES: tamamen sentezlenir (ses dosyası yok) · müzik, efektler, Doppler'lı heykel sesleri, fısıltılar ---------- */
  const AU = (() => {
    let ac = null, master, sfxBus, musBus, padBus, padLP, melBus, revIn, noiseBuf, muted = false, acc = 0;
    const LS = { x: 0, y: 0 }, btn = { x: 0, y: 0, r: 18 }, voices = new Map();
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const C_SND = 800;            // oyun içi 'ses hızı' (px/sn): Doppler kayması net duyulsun diye düşük tutuldu
    const MV = 0.55, SVL = 0.85;  // müzik / efekt seviyesi

    /* ----- temel yapı taşları ----- */
    function tone(d, type, f0, f1, t, dur, vol, o) {
      o = o || {}; const os = ac.createOscillator(), g = ac.createGain(), att = Math.min(o.att || 0.005, dur * 0.9);
      os.type = type; os.frequency.setValueAtTime(f0, t); if (f1 !== f0) os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.1); }
      if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); f.connect(g); } else os.connect(g);
      g.connect(d); os.start(t); os.stop(t + dur + 0.05);
    }
    function nz(d, t, dur, vol, ft, f0, f1, q, att) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); att = Math.min(att || 0.004, dur * 0.9);
      s.buffer = noiseBuf; s.loop = true; f.type = ft; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
    }
    // konumlu çıkış: mesafeye göre kısılır / matlaşır, soldan sağdan gelir
    function bus(x, y, rev) {
      let pan = 0, g = 1, cut = 16000;
      if (x !== undefined) { const dx = x - LS.x, dy = y - LS.y, dd = Math.hypot(dx, dy); if (dd > 950) return null; g = 1 / (1 + (dd / 230) * (dd / 230)); pan = clamp(dx / 330, -1, 1) * 0.85; cut = Math.min(16000, 700 + 15000 / Math.pow(1 + dd / 110, 1.5)); }
      const gn = ac.createGain(), lp = ac.createBiquadFilter(); gn.gain.value = g; lp.type = 'lowpass'; lp.frequency.value = cut; gn.connect(lp);
      let tail = lp; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; lp.connect(p); tail = p; }
      tail.connect(sfxBus); if (rev > 0) { const r = ac.createGain(); r.gain.value = rev; tail.connect(r); r.connect(revIn); }
      return gn;
    }

    /* ----- efektler ----- */
    const SFX = {
      swing(d, t) { nz(d, t, 0.24, 0.5, 'bandpass', 450, 2800, 1.1, 0.08); tone(d, 'sine', 230, 130, t, 0.2, 0.08); },
      hit(d, t, kill) {   // kılıç düşmana isabet etti
        tone(d, 'sine', 190, 55, t, 0.18, 0.9); nz(d, t, 0.1, 0.55, 'highpass', 1800, 2500, 0.7); nz(d, t, 0.2, 0.45, 'bandpass', 1100, 280, 1.4);
        tone(d, 'sawtooth', 420, 110, t, 0.16, 0.2, { lp: 1200 });
        if (kill) { tone(d, 'sine', 100, 32, t, 0.5, 0.8); tone(d, 'triangle', 640, 150, t, 0.35, 0.2); }
      },
      hurt(d, t) {        // biz hasar aldık
        tone(d, 'sine', 160, 42, t, 0.32, 1.0); nz(d, t, 0.28, 0.8, 'lowpass', 900, 180, 0.8); nz(d, t, 0.06, 0.5, 'highpass', 2000, 2000, 0.7);
        tone(d, 'sawtooth', 340, 85, t, 0.38, 0.3, { lp: 900 }); tone(d, 'sine', 2300, 2250, t + 0.02, 0.7, 0.03, { att: 0.02 });   // hafif kulak çınlaması
      },
      block(d, t) {
        [[1180, 0.5, 0.4], [1760, 0.32, 0.3], [2650, 0.2, 0.22], [3480, 0.1, 0.15]].forEach(([f, v, dd]) => tone(d, 'sine', f, f * 0.995, t, dd, v * 0.5));
        nz(d, t, 0.05, 0.5, 'highpass', 3000, 3000, 0.7); tone(d, 'sine', 210, 120, t, 0.1, 0.5);
      },
      guardBreak(d, t) {
        SFX.block(d, t); nz(d, t, 0.5, 0.9, 'lowpass', 2400, 260, 0.8); tone(d, 'sawtooth', 240, 48, t, 0.55, 0.5, { lp: 700 });
        for (let i = 0; i < 5; i++) tone(d, 'sine', 2400 + Math.random() * 3000, 2000, t + 0.03 + i * 0.04, 0.2, 0.07);
      },
      playerDeath(d, t) {
        tone(d, 'sine', 130, 28, t, 1.6, 1.0, { att: 0.02 }); nz(d, t, 1.2, 0.6, 'lowpass', 900, 100, 0.7);
        [220, 261.6, 329.6].forEach(f => tone(d, 'triangle', f, f * 0.5, t + 0.1, 1.8, 0.12, { att: 0.2, lp: 1200 }));
      },
      pickup(d, t) { nz(d, t, 0.4, 0.35, 'highpass', 3500, 9000, 0.8, 0.03); [1318.5, 1760, 2093, 2637].forEach((f, i) => tone(d, 'sine', f, f, t + i * 0.07, 0.8, 0.14)); },
      sheath(d, t) { nz(d, t, 0.05, 0.4, 'bandpass', 3200, 2500, 2); tone(d, 'sine', 900, 500, t, 0.06, 0.25); },
      unsheath(d, t) { nz(d, t, 0.22, 0.3, 'highpass', 2500, 7000, 0.8, 0.02); tone(d, 'sine', 1800, 2600, t, 0.2, 0.05); },
      evilHit(d, t, h) {  // taş darbesi + uğursuz inilti (her darbede daha derin, daha öfkeli)
        h = h || 1; tone(d, 'sine', 120, 38, t, 0.35, 1.0); nz(d, t, 0.38, 0.8, 'lowpass', 2000, 180, 0.8); nz(d, t, 0.07, 0.6, 'highpass', 2500, 2500, 0.7);
        tone(d, 'sawtooth', 95 - h * 6, 48, t, 0.9, 0.4, { lp: 420, att: 0.05, vib: [6, 4] }); tone(d, 'sawtooth', 140 + h * 30, 90, t + 0.05, 0.6, 0.12, { lp: 900 });
      },
      evilShatter(d, t) {
        tone(d, 'sine', 70, 24, t, 1.3, 1.2); nz(d, t, 1.6, 1.0, 'lowpass', 3000, 120, 0.7); tone(d, 'sawtooth', 600, 70, t, 1.6, 0.3, { lp: 900, vib: [6, 20] });
        for (let i = 0; i < 14; i++) nz(d, t + 0.05 + i * 0.07 + Math.random() * 0.08, 0.06, 0.3, 'bandpass', 1500 + Math.random() * 2500, 1200, 3);
      },
      /* düşman sesleri: her yaratığın kendine ait perdesi var (e.vp) */
      eSpawn(d, t, e) { const v = e.vp; nz(d, t, 0.85, 0.45, 'bandpass', 200, 1300, 2, 0.4); tone(d, 'sawtooth', 52 * v, 120 * v, t, 0.85, 0.35, { lp: 500, att: 0.3 }); tone(d, 'sine', 880 * v, 1320 * v, t + 0.2, 0.7, 0.05, { att: 0.3 }); },
      eIdle(d, t, e) {
        const v = e.vp, f = 105 * v;
        tone(d, 'sawtooth', f * 1.1, f * 0.78, t, 1.0, 0.32, { lp: 380, att: 0.25, vib: [4.5 + v, 5] }); tone(d, 'sawtooth', f * 2.02, f * 1.5, t, 0.9, 0.08, { lp: 800, att: 0.3, vib: [5, 7] });
        nz(d, t, 0.9, 0.12, 'bandpass', 700 * v, 500 * v, 3, 0.35);
        if (Math.random() < 0.45) for (let i = 0; i < 4; i++) nz(d, t + 0.1 + i * 0.07 + Math.random() * 0.03, 0.03, 0.25, 'bandpass', 2600, 2600, 4);   // kemik şıkırtısı
      },
      eWind(d, t, e) {
        const v = e.vp, w = e.wd;
        if (e.atk === 'claw') {
          if (e.cmb === 2) { tone(d, 'sine', 40, 95, t, w, 0.7, { att: w * 0.8 }); nz(d, t, w, 0.35, 'lowpass', 200, 900, 1, w * 0.8); tone(d, 'sawtooth', 70 * v, 180 * v, t, w, 0.3, { lp: 700, att: w * 0.6 }); }
          else { tone(d, 'sawtooth', 75 * v, 160 * v, t, w, 0.3, { lp: 650, att: w * 0.7, vib: [9, 6] }); nz(d, t, w, 0.3, 'bandpass', 900, 1800, 2, w * 0.7); }
        } else if (e.atk === 'lunge') { tone(d, 'sawtooth', 420 * v, 1250 * v, t, w, 0.2, { lp: 2600, att: w * 0.8, vib: [11, 25] }); tone(d, 'sine', 60, 110, t, w, 0.4, { att: w * 0.8 }); }
        else { tone(d, 'sine', 170 * v, 720 * v, t, w, 0.3, { att: w * 0.8 }); tone(d, 'sawtooth', 85 * v, 360 * v, t, w, 0.15, { lp: 900, att: w * 0.8, vib: [13, 10] }); nz(d, t, w, 0.14, 'highpass', 3500, 7000, 1, w * 0.9); }
      },
      eClaw(d, t, e) {
        if (e.cmb === 2) { tone(d, 'sine', 110, 32, t, 0.45, 1.0); nz(d, t, 0.5, 0.8, 'lowpass', 1500, 120, 0.8); nz(d, t, 0.06, 0.6, 'highpass', 2500, 2500, 0.7); tone(d, 'sawtooth', 150, 60, t, 0.4, 0.35, { lp: 600 }); }
        else { nz(d, t, 0.16, 0.65, 'bandpass', 3200, 900, 1.6, 0.02); tone(d, 'sawtooth', 190 * e.vp, 90 * e.vp, t, 0.18, 0.28, { lp: 800 }); }
      },
      eLunge(d, t, e) { tone(d, 'sawtooth', 950 * e.vp, 300 * e.vp, t, 0.22, 0.3, { lp: 2200, vib: [14, 30] }); nz(d, t, 0.22, 0.55, 'bandpass', 2400, 500, 1.2, 0.02); },
      eBolt(d, t) { tone(d, 'sine', 1300, 180, t, 0.28, 0.4); nz(d, t, 0.18, 0.35, 'highpass', 2500, 6000, 0.8); nz(d, t, 0.3, 0.4, 'bandpass', 500, 1900, 1.2, 0.05); },
      boltHit(d, t) { nz(d, t, 0.3, 0.55, 'lowpass', 3200, 280, 0.8); tone(d, 'sine', 320, 60, t, 0.2, 0.5); },
      boltBreak(d, t) { nz(d, t, 0.12, 0.4, 'highpass', 3200, 3200, 0.7); tone(d, 'sine', 950, 420, t, 0.12, 0.3); },
      eBlinkOut(d, t) { nz(d, t, 0.4, 0.5, 'bandpass', 2200, 180, 1.5, 0.05); tone(d, 'sine', 760, 80, t, 0.4, 0.4, { att: 0.05 }); },
      eBlinkIn(d, t) { nz(d, t, 0.28, 0.5, 'bandpass', 250, 3200, 1.5, 0.2); tone(d, 'sine', 130, 60, t + 0.22, 0.16, 0.7); },
      eHurt(d, t, e) { const v = e.vp; tone(d, 'sawtooth', 640 * v, 210 * v, t, 0.3, 0.35, { lp: 2600, vib: [18, 22] }); nz(d, t, 0.12, 0.3, 'bandpass', 1500, 900, 1.5); },
      eDie(d, t, e) {
        const v = e.vp; tone(d, 'sawtooth', 720 * v, 46, t, 1.1, 0.42, { lp: 1500, vib: [7, 18], att: 0.02 }); nz(d, t, 1.0, 0.4, 'bandpass', 900, 180, 1.2, 0.05);
        for (let i = 0; i < 6; i++) tone(d, 'sine', 1800 + Math.random() * 1800, 1500, t + 0.25 + i * 0.08, 0.35, 0.04);
      },
      eRage(d, t) { tone(d, 'sawtooth', 90, 40, t, 0.9, 0.55, { lp: 600, att: 0.05, vib: [16, 10] }); tone(d, 'sawtooth', 180, 70, t, 0.8, 0.25, { lp: 1200, vib: [12, 14] }); nz(d, t, 0.9, 0.4, 'bandpass', 500, 250, 1.5, 0.1); }
    };
    const REV = { evilHit: 0.45, evilShatter: 0.6, eIdle: 0.3, eSpawn: 0.4, eRage: 0.4, eDie: 0.3, playerDeath: 0.4, pickup: 0.35 }, GAP = { swing: 0.08, hit: 0.05, eIdle: 0.15, block: 0.05, boltHit: 0.05 }, last = {};
    function sfx(name, x, y, a) {
      if (!ac || ac.state !== 'running' || muted) return; const f = SFX[name]; if (!f) return;
      const t = ac.currentTime; if (t - (last[name] || -9) < (GAP[name] || 0.03)) return; last[name] = t;
      const d = bus(x, y, REV[name] === undefined ? 0.18 : REV[name]); if (d) f(d, t + 0.005, a);
    }

    /* ----- fısıltılar: anlamsız, ne dediği anlaşılmayan heceler (gürültü + formant filtreleri) ----- */
    const VOW = [[730, 1090], [530, 1840], [270, 2290], [570, 840], [300, 870], [660, 1720]];
    function whisper1(x, y, evil, delay, shift) {
      const d = bus(x, y, evil ? 0.7 : 0.5); if (!d) return;

    const msx = bx + (tw / 2 + 1) * (1 - v) + P.lx * 0.2, msy = P.neckY + 4;
    let gp = null, shE = 0;
    if (gOn) {
      const sd = G.sds, mix = (a, b, w) => a.map((q, i) => q + (b[i] - q) * w), tp = G.tw >= 0 ? Math.sin(PI * G.tw) : 0;
      // [el x, el y (omuza göre, ekran), bıçak yönü x, y]
      let pz = mix([sd * 3.5, 9 + Bn * 0.3 - tp * 2, sd * 0.4, -0.92], [sd * 3, 8 + Math.sin(2 * ph) * 0.8, -sd * 0.6, -0.8], rn);
      pz = mix(pz, [cfv * 5 - sd * (1 - v) * 1.5, -3, cfv * 0.7, -0.7], F.gw);
      pz = mix(pz, [sd * 4, 11, sd * 0.5, 0.85], F.bw);
      if (F.sw > 0.001) { const A = F.aim, an = A + F.off; pz = mix(pz, [Math.cos(A) * 8, 0.55 * Math.sin(A) * 8 + 1, Math.cos(an), 0.8 * Math.sin(an)], F.sw); }
      shE = G.eq >= 1 ? sstep(0, 1, G.sh) * (1 - Math.max(F.sw, F.gw, F.bw)) : 0;   // kın ağırlığı
      let tx = msx + fl * (pz[0] + F.tx), ty = msy + pz[1] + F.ty;
      if (shE > 0.001) { tx = lerp(tx, bx + fl * (-sd * lerp(3.5, 6, v)), shE); ty = lerp(ty, msy - 1, shE); }   // kabza yürüyüş yönünün tersindeki omuzda
      let ang = Math.atan2(pz[3] + F.ty * 0.05, pz[2] + F.tx * 0.05), gf = 1;
      if (shE > 0.001) ang += wrap(Math.atan2(0.86, 0.5 * sd) - ang) * shE;
      if (G.eq < 1) {   // kuşanma: el yerdeki kılıca uzanır, sonra poza döner
        let rx = ((G.px - player.x) / S) * fl - msx, ry = (G.py - player.y) / S - msy;
        const k = Math.min(1, 11.6 / (Math.hypot(rx, ry) || 1)), u = sstep(0.4, 0.85, G.eq);
        tx = lerp(msx + rx * k, tx, u); ty = lerp(msy + ry * k, ty, u);
      }
      gp = { tx, ty, ang, gf };
    }
    const behind = !!gp && shE > 0.97 && sf > -0.3;   // kın: sırtta, gövdenin arkasında
    if (behind) drawSword(player.x + fl * S * gp.tx, player.y + S * gp.ty, gp.ang, S * gp.gf, bg, col);
    drawLegs();
    const ik = (sx, sy, tx, ty, bend) => {
      const dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1e-3, L1 = 6.2, L2 = 5.8, dc = Math.min(d, L1 + L2 - 0.08), ux = dx / d, uy = dy / d;
      const a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc), h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
      let px = -uy, py = ux;
      if (Math.abs(py) < 0.25) { if (px * bend < 0) { px = -px; py = -py; } } else if (py < 0) { px = -px; py = -py; }
      return [sx + ux * a + px * h, sy + uy * a + py * h, sx + ux * dc, sy + uy * dc];
    };

    // kollar
    const arm = sd => {
      const ap = ph + (sd > 0 ? PI : 0), sn = Math.sin(ap), aw = lerp(lerp(0.12, 0.5, clamp(H.sp / 115, 0, 1)), 0.85, rn) * mv, kn = Math.max(H.knee, sstep(0, 0.45, F.dp));
      const t1 = lerp(0.05 + 0.04 * Math.sin(H.swPh + sd) + 0.02 * Bn, aw * sn - 0.05 * rn, mv);
      const fx = lerp(0.2 + 0.03 * Bn, lerp(0.2 + 0.2 * (0.5 + 0.5 * sn), 1.4 + 0.2 * Math.sin(ap - 0.6), rn), mv);
      const sx = bx + sd * (tw / 2 + 1) * (1 - v) + P.lx * 0.2, sy = P.neckY + 4;
      let ex = sx + 6.2 * Math.sin(t1) * v + sd * 1.2 * (1 - v), ey = sy + 6.2 * Math.cos(t1);
      let x = ex + 5.8 * Math.sin(t1 + fx) * v + sd * 0.8 * (1 - v), y = ey + 5.8 * Math.cos(t1 + fx);
      ex = lerp(ex, sx + sd * 3 * (1 - v) + 2.5 * v, kn); ey = lerp(ey, sy + 5.5, kn);       // yorgun: eller dizde
      x = lerp(x, bx + sd * 5 * (1 - v) + 5 * v, kn); y = lerp(y, -12 - P.up, kn);
      if (gp && gw > 0.002) {   // kılıçlı kol (sağ); siperde destek eli (sol) kabzaya gelir
        let tgt, wgt;
        if (sd === 1) { tgt = [gp.tx, gp.ty]; wgt = gw * (1 - sstep(0.55, 1, shE)); }
        else { wgt = sstep(0.8, 1, G.eq) * F.gw; tgt = [gp.tx - Math.cos(gp.ang) * fl * 2, gp.ty - Math.sin(gp.ang) * 2 + 1]; }
        wgt *= 1 - kn;
        if (wgt > 0.002) { const r = ik(sx, sy, tgt[0], tgt[1], v > 0.5 ? -(cfv * fl >= 0 ? 1 : -1) : sd); ex = lerp(ex, r[0], wgt); ey = lerp(ey, r[1], wgt); x = lerp(x, r[2], wgt); y = lerp(y, r[3], wgt); }
      }
      if (sd === (v > 0.5 ? 1 : H.cSide) && cw > 0.01) {                                      // öksürük: el ağza
        ex = lerp(ex, sx + sd * 3 * (1 - v) + 3 * v, cw); ey = lerp(ey, sy + 3.5, cw);
        x = lerp(x, hx + 4 * v + sd * 1.2 * (1 - v), cw); y = lerp(y, hy + 3.8, cw);
      }
      if (sd === 1) H.hl = [x, y];
      ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(x, y); ctx.stroke();
    };
    if (v > 0.5) arm(-1);

    // gövde (nefesle şişer) ve kafa
    line(bx, cy - th / 2 + tw / 2, bx, cy + th / 2 - tw / 2, tw);
    const hr = F.dp > 0.25 ? 0 : sstep(0, 0.22, F.wince);   // hasarda kafa anlık kızarır
    if (hr > 0.01) { const a0 = light ? [0, 0, 0] : [255, 255, 255], r0 = light ? [214, 40, 40] : [255, 64, 56]; ctx.fillStyle = `rgb(${Math.round(lerp(a0[0], r0[0], hr))},${Math.round(lerp(a0[1], r0[1], hr))},${Math.round(lerp(a0[2], r0[2], hr))})`; }
    ctx.beginPath(); ctx.arc(hx, hy, 5.4, 0, TAU); ctx.fill(); ctx.fillStyle = col;
    ctx.fillStyle = bg;
    const dead = F.dp > 0.25, pain = dead ? 0 : sstep(0, 0.22, F.wince), tired = sstep(0.45, 0.9, H.fat) * (1 - 0.5 * F.gw);
    const shut = !dead && pain < 0.05 && (cw > 0.3 || F.squint || H.time % 3.7 < 0.12 || H.time % 5.3 < 0.1);
    ctx.fillStyle = bg;
    const eye = (x, y, sd) => {
      ctx.strokeStyle = bg;
      if (dead) { line(x - 0.8, y - 0.8, x + 0.8, y + 0.8, 0.7); line(x - 0.8, y + 0.8, x + 0.8, y - 0.8, 0.7); }                                   // ölü: çarpı göz
      else if (pain > 0.05) { ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(x + sd * 0.95, y - 1); ctx.lineTo(x - sd * 0.7, y); ctx.lineTo(x + sd * 0.95, y + 1); ctx.stroke(); }   // acı: > <
      else if (shut) line(x - 0.9, y, x + 0.9, y, 0.8);
      else { ctx.beginPath(); ctx.ellipse(x, y + 0.25 * tired, 0.85, 0.85 * (1 - 0.55 * tired), 0, 0, TAU); ctx.fill(); }              // yorgun: düşük göz kapağı
    };
    {   // gözler yönle birlikte sürekli değişir: önden iki göz, yandan tek göz, arkadan görünmez
      const ea = sstep(-0.45, -0.05, sf), spr = 2.2 * Math.max(0, sf), exl = (H.yaw * 2.2 + H.ly * 0.5 + G.look * 1.6) * fl * (1 - v);
      ctx.globalAlpha = ea;
      [-1, 1].forEach(sd => { if (sd < 0 && spr < 0.6 && (dead || pain > 0.05)) return; eye(hx + 2.6 * v + sd * spr + exl, hy + 0.4, sd); });
      if (cw > 0.3) { ctx.globalAlpha = ea * (1 - v); ctx.beginPath(); ctx.ellipse(hx + exl * 0.5, hy + 3, 1.1, 1.3 * cw, 0, 0, TAU); ctx.fill(); }
      const mo = Math.max(pain, dead ? 0.6 : 0);
      if (mo > 0.3) { ctx.globalAlpha = ea; ctx.beginPath(); ctx.ellipse(hx + 2.6 * v + exl * 0.5, hy + 3.1, 1, 1.15 * mo, 0, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    arm(1); if (v <= 0.5) arm(-1);
    ctx.restore();

    if (gp) {   // elde tutulan kılıç (ekran uzayında)
      let hlx = H.hl[0], hly = H.hl[1];
      if (rot) { const cr = Math.cos(rot), sr = Math.sin(rot), t0 = hlx; hlx = t0 * cr - hly * sr; hly = t0 * sr + hly * cr; }
      const hxw = player.x + fl * S * hlx, hyw = player.y + S * hly;
      let gx = hxw, gy = hyw, ga = gp.ang + fl * rot, gs = S * gp.gf, spin = G.twA;
      if (G.eq < 1) {
        const g = gunGround(), e1 = sstep(0.12, 0.62, G.eq);
        gx = lerp(g.x, hxw, e1); gy = lerp(g.y, hyw, e1) - Math.sin(PI * e1) * 9;
        ga = g.a + wrap(gp.ang - g.a) * e1; gs = lerp(g.sc, gs, e1); spin += TAU * sstep(0.45, 0.95, G.eq);
      }
      if (shE > 0.001) { const kk = sstep(0.45, 1, shE); gx = lerp(gx, player.x + fl * S * gp.tx, kk); gy = lerp(gy, player.y + S * gp.ty, kk) - Math.sin(PI * kk) * 16; spin -= TAU * sstep(0.05, 0.85, shE); }
      G.px = gx; G.py = gy; G.pa = ga + spin; G.ps = gs;
      if (!F.ds && !behind) drawSword(gx, gy, ga + spin, gs, bg, col);
      const fr = 3 * sstep(0.45, 0.7, G.eq) * (1 - sstep(0.45, 1, shE)) * (F.ds ? 0 : 1);   // yumruk: kabzayı sarar
      if (fr > 0.1) { ctx.beginPath(); ctx.arc(gx, gy, fr, 0, TAU); ctx.lineWidth = 1.4; ctx.strokeStyle = bg; ctx.stroke(); ctx.fillStyle = col; ctx.fill(); }
    }
    if (F.ds) drawSword(F.ds.x, F.ds.y, F.ds.a, F.ds.sc, bg, col);   // elden düşen kılıç
    W(() => H.puffs.forEach(p => { ctx.fillStyle = `rgba(${fg},${0.22 * (1 - p.t / p.life)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.t * 2.2), 0, TAU); ctx.fill(); }));
  }

  /* ---------- Heykeller (sonsuz haritada dekor + çarpışma) ---------- */
  const SS = 1.1;   // heykel ölçeği
  // yuvarlatılmış dikdörtgen yolu (eski tarayıcılarda roundRect yok)
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  const poly = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };

  function drawStatue(sx, sy, sc, fg, light) {
    const ACCENT = '#7a5416';   // taş heykelde göz/taş sönük
    const col = `rgb(${fg})`, bg = light ? '#f2f2f2' : '#0a0a0a';
    const VOID = '#000';                       // kukuletanın içi hep karanlık
    ctx.save();
    ctx.translate(sx, sy); ctx.scale(sc, sc);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // kaide
    ctx.fillStyle = `rgba(${fg},0.5)`; rr(-17, 0, 34, 7, 1.5); ctx.fill();
    ctx.fillStyle = `rgba(${fg},0.85)`; rr(-19, -1.4, 38, 2.6, 1.2); ctx.fill();

    // ---- pelerin (arka katman, yırtık etek) ----
    ctx.fillStyle = `rgba(${fg},0.6)`;
    ctx.beginPath();
    ctx.moveTo(-9, -41); ctx.lineTo(9, -41);
    ctx.bezierCurveTo(14, -32, 17, -18, 17.5, -6);
    ctx.lineTo(11.5, -10); ctx.lineTo(8.5, -4.5); ctx.lineTo(4.5, -9); ctx.lineTo(1, -4);
    ctx.lineTo(-2.5, -9.5); ctx.lineTo(-6.5, -5); ctx.lineTo(-10, -10); ctx.lineTo(-17.5, -6);
    ctx.bezierCurveTo(-17, -18, -14, -32, -9, -41);
    ctx.closePath(); ctx.fill();

    // ---- bacaklar + botlar ----
    ctx.strokeStyle = col; ctx.lineWidth = 4.4;
    [-3.6, 3.6].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -17); ctx.lineTo(x * 1.05, -5); ctx.stroke(); });
    ctx.fillStyle = col;
    rr(-7.6, -5.4, 7.2, 5.4, 1.8); ctx.fill();
    rr(0.4, -5.4, 7.2, 5.4, 1.8); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.7;           // bot kıvrımı
    [-7.2, 0.8].forEach(x => { ctx.beginPath(); ctx.moveTo(x + 0.6, -3.2); ctx.lineTo(x + 6, -3.2); ctx.stroke(); });

    // ---- gövde: tunik + etek ----
    ctx.fillStyle = col;
    poly([[-8, -20], [8, -20], [10.2, -11.5], [-10.2, -11.5]]); ctx.fill();
    rr(-8.6, -41, 17.2, 23, 4); ctx.fill();
    // etek ortası dikişi
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(0, -19.5); ctx.lineTo(0, -12.5); ctx.stroke();
    // göğüs askısı
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-7, -38.5); ctx.lineTo(6.5, -23); ctx.stroke();
    // kemer + tokası
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-8.6, -21); ctx.lineTo(8.6, -21); ctx.stroke();
    ctx.fillStyle = col; rr(-1.8, -22.8, 3.6, 3.6, 0.8); ctx.fill();
    ctx.fillStyle = bg; ctx.fillRect(-0.7, -21.7, 1.4, 1.4);

    // ---- sağ kol (kılıç kolu) ----
    ctx.strokeStyle = col; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(9.5, -37); ctx.lineTo(13.5, -29); ctx.lineTo(13.2, -23); ctx.stroke();

    // ---- kılıç (hafif dışa eğik) ----
    ctx.save(); ctx.translate(13.2, -24); ctx.rotate(0.1);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 4, 1.5, 0, 6.2832); ctx.fill();               // kabza ucu
    ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.arc(0, 4, 0.7, 0, 6.2832); ctx.fill(); // taş
    ctx.fillStyle = col; ctx.fillRect(-1, -3.5, 2, 6.5);                          // sap
    rr(-5, -5, 10, 2.2, 1); ctx.fill();                                         // siper
    poly([[-2.3, -5], [2.3, -5], [1.9, -34], [0, -39], [-1.9, -34]]); ctx.fill(); // kama
    ctx.strokeStyle = bg; ctx.lineWidth = 0.7;                                  // kan oluğu
    ctx.beginPath(); ctx.moveTo(0, -7.5); ctx.lineTo(0, -31); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(13.2, -23, 2.4, 0, 6.2832); ctx.fill(); // el

    // ---- omuz zırhları ----
    [-10.2, 10.2].forEach(x => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, -38, 4.8, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x, -38, 4.8, 0, 6.2832); ctx.stroke();
      ctx.lineWidth = 0.6; ctx.beginPath(); ctx.arc(x, -38, 2.6, 3.6, 5.8); ctx.stroke();
    });

    // ---- kalkan (sol kol önünde) ----
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-14.5, -26, 8.6, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(-14.5, -26, 8.6, 0, 6.2832); ctx.stroke();
    ctx.lineWidth = 0.7; ctx.beginPath(); ctx.arc(-14.5, -26, 6, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(-14.5, -26, 2.1, 0, 6.2832); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-14.5, -26, 0.8, 0, 6.2832); ctx.fill();

    // ---- atkı (boyun) + sarkan ucu ----
    ctx.fillStyle = col;
    poly([[-6, -39], [-2, -38.5], [-5.5, -27], [-9, -28.5]]); ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-8.4, -31); ctx.lineTo(-4.6, -29.8); ctx.stroke();
    rr(-7.4, -42.4, 14.8, 4.6, 2.2); ctx.fill();
    ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(-6, -40.1); ctx.lineTo(6, -40.1); ctx.stroke();

    // ---- kukuleta ----
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-8.8, -40.5);
    ctx.bezierCurveTo(-11.8, -48, -9, -57, -1.5, -60.5);
    ctx.quadraticCurveTo(2.5, -65.5, 6.5, -58.5);       // sivri uç, hafif eğik
    ctx.bezierCurveTo(10.5, -54, 11.5, -46, 8.8, -40.5);
    ctx.quadraticCurveTo(0, -36.5, -8.8, -40.5);
    ctx.closePath(); ctx.fill();
    // kukuleta kıvrım çizgisi
    ctx.strokeStyle = bg; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-6.8, -53.5); ctx.quadraticCurveTo(-2, -60, 2.5, -61.5); ctx.stroke();

    // yüz boşluğu
    ctx.fillStyle = VOID;
    ctx.beginPath(); ctx.ellipse(0, -47.2, 5.4, 6.4, 0, 0, 6.2832); ctx.fill();

    // parlayan gözler
    ctx.save();
    ctx.fillStyle = ACCENT;
    [-2.2, 2.2].forEach(x => { ctx.beginPath(); ctx.ellipse(x, -47.6, 1.15, 0.85, 0, 0, 6.2832); ctx.fill(); });
    ctx.restore();

    ctx.restore();
  }

  // başlangıç çevresinde sabit birkaç heykel, uzağa gidildikçe parça (chunk) başına deterministik üretim
  // [x, y, kimlik, kötücül mü]; kötücül heykel başlangıçta görünür yerde (üstte), uzakta ise parça bazlı seyrek çıkar
  const baseStatues = [[-240, -190], [270, -230], [-70, -470], [330, 260], [60, -255, 'b0', true]];
  const CH = 400;
  const hashN = (i, j, s) => { const x = Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453; return x - Math.floor(x); };
  function statuesIn(x0, y0, x1, y1) {
    const out = [];
    baseStatues.forEach(s => { if (s[0] > x0 && s[0] < x1 && s[1] > y0 && s[1] < y1) out.push(s); });
    for (let ci = Math.floor(x0 / CH); ci <= Math.floor(x1 / CH); ci++)
      for (let cj = Math.floor(y0 / CH); cj <= Math.floor(y1 / CH); cj++) {
        if (ci >= -1 && ci <= 0 && cj >= -2 && cj <= 0) continue;      // başlangıç alanı: sabit heykeller
        if (hashN(ci, cj, 1) > 0.5) continue;
        const sx = ci * CH + 50 + hashN(ci, cj, 2) * (CH - 100), sy = cj * CH + 70 + hashN(ci, cj, 3) * (CH - 110);
        if (sx > x0 && sx < x1 && sy > y0 && sy < y1) out.push(hashN(ci, cj, 8) < 0.12 ? [sx, sy, ci + ',' + cj, true] : [sx, sy]);
      }
    return out;
  }
  function statueNear(x, y, r) { return statuesIn(x - r, y - r, x + r, y + r).length > 0; }
  function collideStatues() {
    statuesIn(player.x - 110, player.y - 110, player.x + 110, player.y + 110).forEach(([sx, sy, id, ev]) => {
      if (ev && evState(id).dead) return;   // kırılmış heykelin enkazı engel olmaz
      const rx = ev ? 27 * ES + 4 : 19 * SS + 7, ry = ev ? 8 * ES + 4 : 6 * SS + 4, nx = (player.x - sx) / rx, ny = (player.y - (sy + 3)) / ry, d = Math.hypot(nx, ny);
      if (d < 1) { const q = d || 0.001; player.x = sx + nx / q * rx; player.y = sy + 3 + (d ? ny / q : 1) * ry; }
    });
  }

  /* ---------- Kötücül heykel: kötü bir ruhun taş kabı. Düşman doğurur; her darbede güçlenir, 5. darbede kırılır ---------- */
  const ES = 1.25;                          // normal heykelden belirgin şekilde büyük
  const EV_INT = [6.5, 5.2, 4.2, 3.4, 2.7];   // doğurma dalgası aralığı (sn): her hasarda kısalır
  const EV_CNT = [1, 2, 2, 3, 3];           // dalga başına yaratık sayısı
  const EV_CAP = [3, 4, 5, 6, 7];           // heykelden aynı anda en çok canlı yaratık
  const EV = new Map();                     // heykel kimliği -> kalıcı durum (hasar, çatlaklar, kırık mı)

    const t = 1 - Math.exp(-14 * sdt), spd = SPEED * (F.guarding ? 0.5 : 1);   // siperdeyken yavaş
    player.vx += (ix * spd - player.vx) * t;
    player.vy += (iy * spd - player.vy) * t;
    player.x += player.vx * sdt; player.y += player.vy * sdt;
    collideStatues();
    if (Math.hypot(player.vx, player.vy) > 12) player.angle = Math.atan2(player.vy, player.vx);

    updateHero(sdt);
    updateGun(sdt);
    updateFight(sdt);
    updateEnemies(sdt);
    updateBolts(sdt);
    updateEvil(sdt);
    updateFx(dt, sdt);
    let alert = 0; for (const e of E) if (e.em >= 1 && Math.hypot(e.x - player.x, e.y - player.y) < 460) alert += e.st === 'wind' || e.st === 'strike' ? 0.3 : 0.18;
    AU.setListener(player.x, player.y); AU.update(dt, clamp(alert, 0, 1));   // müzik yoğunluğu çatışmayla yükselir; heykel sesleri / Doppler

    joy.alpha += ((joy.active ? 1 : 0) - joy.alpha) * (1 - Math.exp(-16 * dt));

    // çizim
    const bgCol = light ? '#f2f2f2' : '#0a0a0a';
    const fg = light ? '0,0,0' : '255,255,255';
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H);
    const ck = dmp(10, dt); cam.x += (player.x - W / 2 - cam.x) * ck; cam.y += (player.y - H / 2 - cam.y) * ck;   // kamera yumuşak takip
    cam.x += FX.ox; cam.y += FX.oy;   // kamera sarsıntısı
    drawWorld(fg);
    setBase();
    drawPrints(fg);
    drawTele(fg);

    drawGroundGun(fg, light);
    const sfg = light ? '105,105,105' : '150,150,150';
    const sObjs = statuesIn(cam.x - 80, cam.y - 20, cam.x + W + 80, cam.y + H + 140).map(([x, y, id, ev]) => ({ y, f: ev ? () => drawEvil(x, y, id, light) : () => drawStatue(x, y, SS, sfg, light) }));
    const eObjs = E.map(e => ({ y: e.y, f: () => drawEnemy(e, fg) })).concat(EP.map(p => ({ y: p.y, f: () => drawBolt(p, fg) }))), allO = sObjs.concat(eObjs).sort((a, b) => a.y - b.y);
    allO.filter(o => o.y < player.y).forEach(o => o.f());
    ctx.globalAlpha = F.flash > 0 && Math.floor(F.time * 30) % 2 ? 0.4 : 1;   // hasar alınca yanıp söner
    drawHero(fg, light);
    ctx.globalAlpha = 1;
    drawSlash(fg);
    drawSparks(fg);
    allO.filter(o => o.y >= player.y).forEach(o => o.f());
    drawSmoke(light); drawDebris(light); drawRings();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (light) {
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(0,0,0,0.7)';
      debugLines().forEach((t, i) => ctx.fillText(t, 20, 90 + i * 16));
    }

    if (F.dp > 0.01) { ctx.fillStyle = light ? `rgba(242,242,242,${0.4 * F.dp})` : `rgba(0,0,0,${0.45 * F.dp})`; ctx.fillRect(0, 0, W, H); }   // ölümde ekran kararır
    // joystick
    if (joy.alpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = joy.alpha;
      const bg = ctx.createRadialGradient(joy.bx, joy.by, joy.R * 0.2, joy.bx, joy.by, joy.R);
      bg.addColorStop(0, `rgba(${fg},0.03)`);
      bg.addColorStop(1, `rgba(${fg},0.12)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${fg},0.28)`; ctx.stroke();

      const kg = ctx.createRadialGradient(joy.kx - 6, joy.ky - 8, 2, joy.kx, joy.ky, 28);
      kg.addColorStop(0, `rgba(${fg},0.55)`);
      kg.addColorStop(1, `rgba(${fg},0.22)`);
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 27, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.stroke();
      ctx.restore();
    }
    drawHud(fg);
    drawAtk(fg); drawMute(fg);
    cam.x -= FX.ox; cam.y -= FX.oy;
    requestAnimationFrame(frame);
  }

  addEventListener('scroll', () => { if (scrollX || scrollY) scrollTo(0, 0); });
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
