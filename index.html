<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Oyun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oyun">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overscroll-behavior: none; }
  body {
    position: fixed; top: 0; left: 0; margin: 0; padding: 0;
    width: 100%; height: 100%; background: #000; overflow: visible;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  /* ---------- PWA: service worker ---------- */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    // iOS ana ekran modunda innerHeight alt güvenli alanı (home indicator) hariç tutabiliyor;
    // bu durumda gerçek ekran yüksekliğini kullanıp tuvali tam boyuta uzatıyoruz.
    if (navigator.standalone === true) {
      const full = Math.max(screen.width, screen.height);
      if (H > W && full > H) H = full;
    }
    const de = document.documentElement.style, bs = document.body.style;
    bs.width = W + 'px'; bs.height = H + 'px';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.x = Math.min(Math.max(player.x, player.r), W - player.r);
    player.y = Math.min(Math.max(player.y, player.r), H - player.r);
  }

  /* ---------- Hata ayıklama bilgisi (açık zemin modunda görünür) ---------- */
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100vh;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(probe);
  function debugLines() {
    const sab = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
    return [
      'tuval ' + W + 'x' + H,
      'inner ' + innerWidth + 'x' + innerHeight,
      'screen ' + screen.width + 'x' + screen.height,
      '100vh ' + probe.getBoundingClientRect().height,
      'alt guvenli alan ' + sab,
      'standalone ' + navigator.standalone
    ];
  }

  /* ---------- Oyuncu ---------- */
  const player = { x: window.innerWidth / 2, y: window.innerHeight / 2, vx: 0, vy: 0, r: 14, angle: -Math.PI / 2 };
  const SPEED = 230;

  /* ---------- Dinamik joystick ---------- */
  const joy = { id: null, active: false, bx: 0, by: 0, kx: 0, ky: 0, dx: 0, dy: 0, alpha: 0, R: 62 };

  /* ---------- Test: çift dokunuşla arka plan değiştir ---------- */
  let light = false, lastTap = { t: 0, x: 0, y: 0 };
  function toggleBg() {
    light = !light;
    const c = light ? '#f2f2f2' : '#000';
    document.documentElement.style.background = document.body.style.background = cv.style.background = c;
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', c);
  }
  function checkDoubleTap(e) {
    const now = performance.now();
    if (now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
      toggleBg(); lastTap.t = 0;
    } else lastTap = { t: now, x: e.clientX, y: e.clientY };
  }

  function joyStart(e) {
    checkDoubleTap(e);
    if (joy.id !== null) return;
    joy.id = e.pointerId; joy.active = true;
    joy.bx = joy.kx = e.clientX; joy.by = joy.ky = e.clientY;
    joy.dx = joy.dy = 0;
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function joyMove(e) {
    if (e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.bx, dy = e.clientY - joy.by;
    const d = Math.hypot(dx, dy);
    if (d > joy.R) { // taban parmağı takip eder
      const k = (d - joy.R) / d;
      joy.bx += dx * k; joy.by += dy * k;
      dx = e.clientX - joy.bx; dy = e.clientY - joy.by;
    }
    joy.kx = joy.bx + dx; joy.ky = joy.by + dy;
    joy.dx = dx / joy.R; joy.dy = dy / joy.R;
  }
  function joyEnd(e) {
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.active = false; joy.dx = joy.dy = 0;
    joy.kx = joy.bx; joy.ky = joy.by;
  }
  window.addEventListener('pointerdown', joyStart);
  window.addEventListener('pointermove', joyMove);
  window.addEventListener('pointerup', joyEnd);
  window.addEventListener('pointercancel', joyEnd);
  ['gesturestart', 'contextmenu'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  /* ---------- Klavye (masaüstü testi) ---------- */
  const keys = {};
  addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  /* ---------- Döngü ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    let ix = joy.dx, iy = joy.dy;
    if (keys['arrowleft'] || keys['a']) ix -= 1;
    if (keys['arrowright'] || keys['d']) ix += 1;
    if (keys['arrowup'] || keys['w']) iy -= 1;
    if (keys['arrowdown'] || keys['s']) iy += 1;
    const m = Math.hypot(ix, iy);
    if (m > 1) { ix /= m; iy /= m; }

    // yumuşak ivmelenme
    const t = 1 - Math.exp(-14 * dt);
    player.vx += (ix * SPEED - player.vx) * t;
    player.vy += (iy * SPEED - player.vy) * t;
    player.x += player.vx * dt; player.y += player.vy * dt;
    player.x = Math.min(Math.max(player.x, player.r), W - player.r);
    player.y = Math.min(Math.max(player.y, player.r), H - player.r);
    if (Math.hypot(player.vx, player.vy) > 12) player.angle = Math.atan2(player.vy, player.vx);

    joy.alpha += ((joy.active ? 1 : 0) - joy.alpha) * (1 - Math.exp(-16 * dt));

    // çizim
    const bgCol = light ? '#f2f2f2' : '#000';
    const fg = light ? '0,0,0' : '255,255,255';
    ctx.fillStyle = bgCol; ctx.fillRect(0, 0, W, H);

    // karakter (kuş bakışı)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.shadowColor = `rgba(${fg},0.35)`; ctx.shadowBlur = 18;
    ctx.fillStyle = `rgb(${fg})`;
    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.rotate(player.angle);
    ctx.fillStyle = bgCol;
    ctx.beginPath(); ctx.arc(player.r * 0.5, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (light) {
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(0,0,0,0.7)';
      debugLines().forEach((t, i) => ctx.fillText(t, 20, 90 + i * 16));
    }

    // joystick
    if (joy.alpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = joy.alpha;
      const bg = ctx.createRadialGradient(joy.bx, joy.by, joy.R * 0.2, joy.bx, joy.by, joy.R);
      bg.addColorStop(0, `rgba(${fg},0.03)`);
      bg.addColorStop(1, `rgba(${fg},0.12)`);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(${fg},0.28)`; ctx.stroke();

      const kg = ctx.createRadialGradient(joy.kx - 6, joy.ky - 8, 2, joy.kx, joy.ky, 28);
      kg.addColorStop(0, `rgba(${fg},0.55)`);
      kg.addColorStop(1, `rgba(${fg},0.22)`);
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 27, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(${fg},0.35)`; ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
